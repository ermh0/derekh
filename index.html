<style>

/* Layout: one phone-width column. The course is a route of eight stations, each marked by a Hebrew letter (alef to het); lessons, quiz and cards are stops on it. */
:root{
  --bg:#ECEEF4;
  --surface:#FAFBFE;
  --ink:#13172B;
  --ink-2:#4A5070;
  --line:#CBD1E3;
  --accent:#1B4DB8;
  --on-accent:#FFFFFF;
  --accent-soft:#DAE3F8;
  --good:#1E7A4C;
  --good-soft:#D6EEE0;
  --bad:#B3342F;
  --bad-soft:#F6DAD8;
  --reward:#956410;
  --f-display:"Alegreya",Georgia,serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-he:"Frank Ruhl Libre","David Libre","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1120;
    --surface:#151B30;
    --ink:#E8EAF4;
    --ink-2:#A0A8C8;
    --line:#2B3558;
    --accent:#86A3FF;
    --on-accent:#0D1120;
    --accent-soft:#1E2A55;
    --good:#62C894;
    --good-soft:#12342A;
    --bad:#F2908A;
    --bad-soft:#3B1C1E;
    --reward:#E3B34F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1120;
  --surface:#151B30;
  --ink:#E8EAF4;
  --ink-2:#A0A8C8;
  --line:#2B3558;
  --accent:#86A3FF;
  --on-accent:#0D1120;
  --accent-soft:#1E2A55;
  --good:#62C894;
  --good-soft:#12342A;
  --bad:#F2908A;
  --bad-soft:#3B1C1E;
  --reward:#E3B34F;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p,ol,ul{margin:0;padding:0}
ol,ul{list-style:none}
svg{width:18px;height:18px;flex:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.he{font-family:var(--f-he);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-2)}

.app{
  max-width:520px;margin:0 auto;
  padding-block:20px calc(92px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.app.focus{padding-block:16px calc(40px + env(safe-area-inset-bottom,0px))}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand-name{font-family:var(--f-display);font-weight:800;font-size:32px;letter-spacing:-.01em;line-height:1.1}
.brand .he{font-size:22px;color:var(--accent)}
.chips{display:flex;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.chip svg{width:16px;height:16px;color:var(--accent)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.weeks{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin:10px 0 28px}
.weeks i{height:6px;background:var(--line);border-radius:2px}
.weeks i.on{background:var(--accent)}
.weeks i.cur{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}

/* route */
.stop{display:grid;grid-template-columns:44px minmax(0,1fr);gap:16px}
.rail{position:relative;display:flex;justify-content:center}
.rail::after{content:"";position:absolute;top:48px;bottom:4px;left:50%;width:2px;margin-left:-1px;background:var(--line)}
.stop:last-child .rail::after{display:none}
.stop.done .rail::after{background:var(--accent)}
.node{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-he);font-weight:700;font-size:24px;line-height:1;background:var(--surface);color:var(--ink-2);border:2px dashed var(--line)}
.node svg{width:22px;height:22px}
.stop.current .node{background:var(--accent);color:var(--on-accent);border:2px solid var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.stop.done .node{background:var(--accent);color:var(--on-accent);border:2px solid var(--accent)}
.stop-body{padding-bottom:24px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px}
.panel-top,.soft-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.he-term{font-size:24px;color:var(--accent)}
.stop-title{display:block;font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.2;text-wrap:balance}
.panel .stop-title{font-size:30px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.meta{font-size:14px;color:var(--ink-2)}
.soft{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;background:none;border:0;padding:6px 0 0}
.stop-he{font-size:18px;color:var(--ink-2)}
.soft-desc{font-size:15px}
.lockline{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);margin-top:4px}
.lockline svg{width:14px;height:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;padding:12px 20px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:600;font-size:16px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn-row{display:flex;flex-direction:column;gap:10px;margin-top:8px}

/* level */
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:8px 0;margin-bottom:10px;color:var(--accent);font-weight:600}
.back svg{transform:rotate(180deg)}
.lvl-head{display:flex;flex-direction:column;gap:6px;margin-bottom:24px}
.lvl-title{font-family:var(--f-display);font-weight:800;font-size:42px;line-height:1.05}
.lvl-he{font-size:30px;color:var(--accent);text-align:left}
.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:36px minmax(0,1fr) 20px;gap:14px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 0;min-height:68px}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.dot svg{width:18px;height:18px}
.row.open .dot{border-color:var(--accent);color:var(--accent)}
.row.done .dot{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.row-title{display:block;font-weight:600}
.row-sub{display:block;font-size:14px;color:var(--ink-2)}
.row.locked .row-title{color:var(--ink-2)}
.chev{color:var(--ink-2)}
.chev svg{width:18px;height:18px}
.section-label{margin:28px 0 10px}

/* lesson and quiz */
.lbar{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:50%;color:var(--ink);flex:none}
.icon-btn svg{width:20px;height:20px}
.segs{flex:1;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.segs i{height:6px;background:var(--line);border-radius:2px}
.segs i.on{background:var(--accent)}
.segs i.cur{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.stack{display:flex;flex-direction:column;gap:16px}
.stack h2{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.15;text-wrap:balance}
.he-hero{font-family:var(--f-he);font-weight:700;font-size:68px;line-height:1.05;color:var(--accent);text-align:left}
.prose{font-size:18px;line-height:1.6;max-width:62ch}
.verse{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 0;display:flex;flex-direction:column;gap:10px}
.verse .he{font-size:34px;line-height:1.35;text-align:left}
.verse p{font-family:var(--f-display);font-size:20px;line-height:1.4}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{width:100%;text-align:left;padding:14px 16px;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;font-size:16px;line-height:1.35;min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.opt:not(:disabled):hover{border-color:var(--accent)}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.good{border-color:var(--good);background:var(--good-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.good svg{color:var(--good)}
.opt.bad svg{color:var(--bad)}
.opt svg{width:20px;height:20px}
.fb{padding:14px 16px;border-radius:8px;font-size:16px;line-height:1.5}
.fb.good{background:var(--good-soft)}
.fb.bad{background:var(--bad-soft)}
.fb.good b{color:var(--good)}
.fb.bad b{color:var(--bad)}
.stars{display:flex;gap:6px}
.stars svg{width:38px;height:38px;color:var(--reward)}
.result-num{font-family:var(--f-display);font-weight:800;font-size:56px;line-height:1}

/* cards */
.lead{display:flex;flex-direction:column;gap:4px;margin-bottom:18px}
.lead h2{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.15}
.fc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:290px;width:100%;padding:28px 20px;text-align:center;border:1px solid var(--line);background:var(--surface);border-radius:10px}
.fc.flipped{border-color:var(--accent)}
.fc .he{font-size:60px;line-height:1.1;color:var(--accent)}
.fc .he.sm{font-size:30px}
.fc .term{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.15}
.fc .hint{font-size:14px;color:var(--ink-2)}
.fc .def{font-size:18px;line-height:1.55;max-width:34ch}
.fc-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.fc-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;font-size:14px;color:var(--ink-2)}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:600;font-size:14px}
.terms{border-top:1px solid var(--line);margin-top:24px}
.terms li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.terms .t{font-weight:600}
.terms .he{font-size:20px;color:var(--ink-2)}
.pips{display:inline-flex;gap:3px}
.pips i{width:10px;height:10px;border:1.5px solid var(--line);border-radius:2px}
.pips i.on{background:var(--accent);border-color:var(--accent)}
.stat-line{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:15px;color:var(--ink-2);margin-bottom:16px}
.stat-line b{color:var(--ink);font-variant-numeric:tabular-nums}

/* badges */
.bgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}
.badge{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:16px 0;border-top:1px solid var(--line)}
.medal{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-he);font-weight:700;font-size:32px;line-height:1;border:2px dashed var(--line);color:var(--ink-2)}
.badge.on .medal{background:var(--accent);border:2px solid var(--accent);color:var(--on-accent)}
.badge-name{font-weight:600;line-height:1.25}
.badge-how{font-size:14px;color:var(--ink-2);line-height:1.35}
.reset{margin-top:32px;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.reset .btn-inline{display:flex;gap:10px;flex-wrap:wrap}
.btn-sm{min-height:44px;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn-sm.danger{border-color:var(--bad);color:var(--bad)}

/* tab bar and toast */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 8px;background:none;border:0;color:var(--ink-2);font-size:12px;font-weight:600;min-height:58px}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar svg{width:24px;height:24px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);width:max-content;max-width:calc(100vw - 32px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;font-size:15px;line-height:1.35;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.srcs{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--line)}
.srcs li{padding:10px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.4;overflow-wrap:anywhere}
.srcs a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
</style>


</head>
<body>
<div class="app" id="app"></div>

<nav class="tabbar" id="tabs" aria-label="Разделы">

  const WEEKS = [{"n":1,"letter":"א","title":"Основы","he":"יסודות","desc":"Кто такие евреи, один Б-г, Завет и язык понятий","lessons":[{"id":"w1l1","title":"Народ и вера","steps":[{"he":"עם","h":"Народ и традиция сразу","p":"Слово «еврей» называет и народ, и принадлежность к религиозной традиции. Поэтому еврей может быть глубоко верующим, а может считать себя светским. По традиционному взгляду, человек, родившийся евреем, остаётся им, даже если не соблюдает заповеди."},{"h":"Откуда берутся названия","p":"В Торе слово «иври» (еврей) впервые применено к Аврааму (Быт. 14:13). «Иудей» происходит от имени Йегуды (Иуды), сына Яакова: от его колена получило имя царство Иудея, а затем и весь народ. «Израиль» — второе имя Яакова (Быт. 32:29); его потомков называют «Бней Исраэль», сыновья Израиля."},{"h":"Кто считается евреем","p":"По традиционной галахе, еврей — это тот, кто родился от еврейской матери или прошёл гиюр, то есть обращение. Реформистское движение в США с 1983 года признаёт еврейским и ребёнка еврейского отца, если это подтверждено поступками: обрядами, изучением Торы, воспитанием в еврейской жизни. Это один из реальных споров между течениями, к нему мы вернёмся на восьмой неделе."}],"check":{"q":"От имени какого сына Яакова происходит слово «иудей»?","opts":["Леви","Йосеф (Иосиф)","Йегуда (Иуда)","Биньямин (Вениамин)"],"a":2,"why":"Колено Йегуды дало имя царству Иудея, а позже и всему народу."}},{"id":"w1l2","title":"Один Б-г","steps":[{"he":"אחד","h":"Главная идея","p":"Иудаизм учит, что Б-г един, не имеет тела и образа и сотворил мир. Он не часть природы и не делит власть с другими божествами. Такое учение называют монотеизмом."},{"h":"Шма Исраэль","verse":{"he":"שמע ישראל ה׳ אלהינו ה׳ אחד","ru":"«Слушай, Израиль: Адо-най — наш Б-г, Адо-най един» (Втор. 6:4)"},"p":"Это главная декларация веры. Её произносят утром и вечером, и это одна из первых молитв, которую учат дети."},{"h":"Имя, которое не произносят","p":"Имя Б-га из четырёх букв, тетраграмматон, в Торе записано, но не читается так, как написано. При чтении вместо него говорят «Адо-най», а в обычной речи «Ха-Шем», то есть «Имя». Из уважения к Имени, чтобы случайно не стереть его, многие пишут «Б-г» с дефисом."}],"check":{"q":"Как в обычной речи называют Б-га, не произнося Имени?","opts":["Ха-Шем («Имя»)","Ха-Тора («Учение»)","Ха-Брит («Союз»)","Ха-Галаха («Путь»)"],"a":0,"why":"«Ха-Шем» буквально значит «Имя». Остальные слова из списка — термины, которые вы встретите дальше."}},{"id":"w1l3","title":"Завет","steps":[{"he":"ברית","h":"Союз двух сторон","p":"Брит значит «союз, завет». По традиции Б-г заключает завет с Авраамом, а затем со всем народом у горы Синай. Это взаимные обязательства: в иудаизме важна не только вера, но и поступки. Течения иудаизма по-разному понимают избранность народа: от ответственности и миссии до отказа от самой идеи.","verse":{"he":"רק אתכם ידעתי מכל משפחות האדמה על כן אפקד עליכם את כל עונתיכם","ru":"«Только вас Я знал из всех родов земли, поэтому взыщу с вас за все ваши прегрешения» (Амос 3:2)"}},{"h":"Авраам и брит-мила","p":"С Авраамом завет связан с обещанием потомства и земли. Знаком завета названо обрезание, брит-мила. Его совершают мальчикам на восьмой день жизни (Быт. 17)."},{"h":"Синай","p":"У горы Синай, как рассказывает книга Исход, народ получает Тору. В центре рассказа об откровении стоят «Десять речений» (асерет ха-диброт): от запрета идолопоклонства до заповеди о субботе и запретов убивать, красть и лжесвидетельствовать (Исх. 20; повторены во Втор. 5). Традиция считает, что вместе с текстом передавалось и устное объяснение. О нём поговорим на пятой неделе."}],"check":{"q":"Сколько «речений» (диброт), по традиции, было дано у горы Синай?","opts":["Семь","Десять","Двенадцать","Шестьсот тринадцать"],"a":1,"why":"Асерет ха-диброт значит «Десять речений». Число 613 — это общее число заповедей в традиции, о нём следующий урок."}},{"id":"w1l4","title":"Язык понятий","steps":[{"he":"מצווה","h":"Мицва","p":"Мицва значит «заповедь». Традиция насчитывает 613 мицвот (этот счёт приводит Талмуд, Макот 23б, от имени рабби Симлая): 248 велений («делай») и 365 запретов («не делай»). Какие именно заповеди входят в этот список, средневековые авторы считали по-разному. В разговорной речи «мицва» ещё и «доброе дело»."},{"he":"הלכה","h":"Галаха","p":"Галаха — это религиозное право: как именно исполнять мицвот в жизни. Слово происходит от корня «ходить», то есть «путь, по которому идут». Эту же идею несёт название приложения: «дерех» значит «дорога»."},{"he":"אגדה","h":"Аггада","p":"Аггада — всё, что не право: притчи, истории, этические наставления и легенды мудрецов. Галаха отвечает на вопрос «как поступать», а аггада на вопрос «зачем и почему». В Талмуде они переплетены."}],"check":{"q":"Что из этого относится к аггаде?","opts":["Закон о границах субботнего пути","Правила приготовления кошерной еды","Время чтения Шма утром и вечером","Притча мудреца о милосердии"],"a":3,"why":"Притча и история относятся к аггаде. Остальные варианты — материал галахи: нормы и правила."}}],"quiz":[{"q":"От какого корня происходит слово «галаха»?","opts":["«Говорить»","«Ходить, идти»","«Записывать»","«Учить»"],"a":1,"why":"Галаха — «путь, по которому идут»: нормы о том, как жить по заповедям."},{"q":"Кто считается евреем по традиционной галахе?","opts":["Только тот, кто соблюдает шаббат","Любой, кто живёт в Израиле","Родившийся от еврейской матери или прошедший гиюр","Тот, у кого еврейская фамилия"],"a":2,"why":"Так считают традиционные течения. Реформистское движение в США с 1983 года признаёт и происхождение по отцу, если оно подтверждено поступками и воспитанием."},{"q":"С каких слов начинается главная декларация веры «Шма»?","opts":["«Слушай, Израиль»","«В начале сотворил Б-г»","«Помни день субботний»","«Да будет свет»"],"a":0,"why":"«Шма Исраэль» значит «Слушай, Израиль» (Втор. 6:4). Остальные фразы — другие известные места Торы."},{"q":"Как по традиции поступают с Именем Б-га из четырёх букв?","opts":["Заменяют именем Авраама","Читают вслух так, как написано","Произносят только в синагоге","Читают «Адо-най» или говорят «Ха-Шем»"],"a":3,"why":"Имя записано в Торе, но вслух так, как написано, его не произносят: при чтении говорят «Адо-най», в речи «Ха-Шем»."},{"q":"Сколько всего заповедей насчитывает традиция?","opts":["10","248","365","613"],"a":3,"why":"613: это 248 велений и 365 запретов. Числа 248 и 365 из вариантов — это части общего счёта."},{"q":"Какой обряд назван знаком завета с Авраамом?","opts":["Пасхальная трапеза","Брит-мила (обрезание)","Ношение цицит","Паломничество в Иерусалим"],"a":1,"why":"Об этом сказано в Быт. 17. Обряд совершают на восьмой день жизни мальчика."},{"q":"Чьё второе имя, по Торе, Израиль?","opts":["Яаков (Иаков)","Авраам","Ицхак (Исаак)","Моше (Моисей)"],"a":0,"why":"В Быт. 32:29 Яаков получает имя Израиль. Поэтому его потомков называют «Бней Исраэль», сыновья Израиля."},{"q":"Что говорит пророк Амос о народе, которого Б-г «знал» из всех родов земли?","opts":["Он освобождён от наказания","Он не нуждается в законах","Он будет призван к ответу за свои прегрешения","Он станет править другими народами"],"a":2,"why":"Амос 3:2: «Только вас Я знал из всех родов земли, поэтому взыщу с вас за все ваши прегрешения». Многие понимают избранность как ответственность, но течения иудаизма трактуют её по-разному."}],"cards":[{"id":"w1c1","he":"תורה","term":"Тора","def":"Учение, наставление. В узком смысле Пятикнижие Моисеево, в широком вся традиция Б-жьего учения, письменная и устная."},{"id":"w1c2","he":"מצווה","term":"Мицва","def":"Заповедь. По традиционному счёту их 613: 248 велений и 365 запретов. В разговорной речи ещё и «доброе дело»."},{"id":"w1c3","he":"הלכה","term":"Галаха","def":"Религиозное право. От корня «ходить»: путь, по которому идут."},{"id":"w1c4","he":"אגדה","term":"Аггада","def":"Часть традиции, которая не право: притчи, истории, этика, легенды мудрецов."},{"id":"w1c5","he":"ברית","term":"Брит","def":"Союз, завет между Б-гом и народом."},{"id":"w1c6","he":"ברית מילה","term":"Брит-мила","def":"«Завет обрезания», знак завета с Авраамом. Совершается на восьмой день жизни мальчика."},{"id":"w1c7","he":"שמע ישראל","term":"Шма Исраэль","def":"«Слушай, Израиль». Главная декларация веры в единого Б-га, Втор. 6:4."},{"id":"w1c8","he":"השם","term":"Ха-Шем","def":"«Имя». Так в обычной речи называют Б-га, не произнося Его Имени."},{"id":"w1c9","he":"בני ישראל","term":"Бней Исраэль","def":"«Сыновья Израиля». Традиционное название еврейского народа."},{"id":"w1c10","he":"גיור","term":"Гиюр","def":"Обращение в иудаизм."},{"id":"w1c11","he":"עשרת הדיברות","term":"Асерет ха-диброт","def":"«Десять речений», известные как Десять заповедей. Исх. 20 и Втор. 5."},{"id":"w1c12","he":"יהודי","term":"Йегуди","def":"Еврей, иудей. От имени Йегуды (Иуды), сына Яакова."}],"sources":[{"title":"Sefaria: Genesis 14:13","url":"https://www.sefaria.org/Genesis.14.13"},{"title":"Sefaria: Amos 3:2","url":"https://www.sefaria.org/Amos.3.2"},{"title":"Sefaria: Makkot 23b","url":"https://www.sefaria.org/Makkot.23b"},{"title":"Encyclopaedia Britannica: Jew (people)","url":"https://www.britannica.com/topic/Jew-people"},{"title":"My Jewish Learning: Patrilineal Descent","url":"https://www.myjewishlearning.com/article/patrilineal-descent/"},{"title":"Jewish Virtual Library: Reform Judaism, patrilineal descent","url":"https://www.jewishvirtuallibrary.org/jsource/Judaism/patrilineal1.html"},{"title":"My Jewish Learning: The Shema","url":"https://www.myjewishlearning.com/article/the-shema/"},{"title":"Jewish Virtual Library: Halakhah","url":"https://www.jewishvirtuallibrary.org/halakhah"},{"title":"TheTorah.com: Who Were the Hebrews","url":"https://www.thetorah.com/article/who-were-the-hebrews"},{"title":"My Jewish Learning: Chosen People","url":"https://www.myjewishlearning.com/article/chosen-people/"}]},{"n":2,"letter":"ב","title":"Танах","he":"תנ״ך","desc":"Тора, Пророки и Писания: как устроена Библия","lessons":[{"id":"w2l1","title":"Три части Танаха","steps":[{"he":"תנ״ך","h":"Слово из трёх букв","p":"Еврейская Библия называется Танах. Это аббревиатура из первых букв трёх её частей: Тора (Учение), Невиим (Пророки) и Ктувим (Писания). Тора — это пять книг. Каждая названа по слову из первой фразы: Берешит (Бытие), Шмот (Исход), Ваикра (Левит), Бемидбар (Числа), Дварим (Второзаконие)."},{"he":"נביאים","h":"Пророки ранние и поздние","p":"Невиим делят на две группы. Ранние пророки рассказывают историю народа: книги Йегошуа (Иисус Навин), Шофтим (Судьи), Шмуэль (Самуил) и Мелахим (Цари). Поздние пророки — это книги Йешаягу (Исаия), Ирмеягу (Иеремия), Йехезкель (Иезекииль) и «Двенадцать»: двенадцать коротких пророческих книг. Их издавна писали на одном свитке и считают одной книгой."},{"h":"Двадцать четыре книги","p":"По еврейскому счёту в Танахе 24 книги: 5 в Торе, 8 в Пророках и 11 в Писаниях. В Писания входят, например, Теилим (Псалмы), Мишлей (Притчи), Иов, Рут (Руфь) и Эстер (Есфирь). Шмуэль, Мелахим и Диврей ха-ямим (Хроники) считаются каждая одной книгой. В христианском Ветхом Завете те же тексты поделены и расставлены иначе. Например, в протестантских изданиях выходит 39 книг, а пророки стоят в конце."}],"check":{"q":"Сколько книг в Танахе по еврейскому счёту?","opts":["39","24","12","54"],"a":1,"why":"24 книги: 5 в Торе, 8 в Пророках, 11 в Писаниях. 39 получается в протестантском счёте тех же текстов."}},{"id":"w2l2","title":"Бытие и Исход: сюжет","steps":[{"he":"בראשית","h":"Начало и Авраам","verse":{"he":"ויאמר ה׳ אל אברם לך לך מארצך וממולדתך ומבית אביך אל הארץ אשר אראך","ru":"«И сказал Б-г Авраму: иди из земли твоей, от родни твоей и из дома отца твоего в землю, которую Я покажу тебе» (Быт. 12:1)"},"p":"Книга Бытия открывается сотворением мира. Дальше идут Адам и Ева, Каин и Авель, потоп и Ноах (Ной), Вавилонская башня. С 12-й главы рассказ переходит к одной семье: Авраама и Сары. В этом стихе он ещё зовётся Аврам: новое имя он получит позже (Быт. 17:5)."},{"h":"Праотцы и двенадцать сыновей","p":"Сын Авраама и Сары — Ицхак (Исаак), его жена Ривка (Ревекка). Их сын Яаков (Иаков) женится на Лее и Рахели и получает второе имя Израиль. У Яакова двенадцать сыновей. Братья из зависти продают Йосефа (Иосифа), и он попадает в Египет. Там он толкует сны фараона и становится вторым человеком после фараона. В голод вся семья переселяется к нему."},{"he":"שמות","h":"Исход и Синай","p":"Книга Исход начинается с того, что новый фараон порабощает потомков Яакова. Моше (Моисей) вырастает в доме дочери фараона, а у горящего куста получает призвание. Египет поражают десять казней, народ уходит, проходит через море и у горы Синай получает Десять речений. Это пересказ текста. Как смотрят на эти события историки, обсудим на третьей неделе."}],"check":{"q":"Как, по книге Бытия, Йосеф оказался в Египте?","opts":["Его продали братья","Его послал туда Авраам","Он бежал от потопа","Его вывел Моше"],"a":0,"why":"Братья из зависти продали Йосефа, и его привезли в Египет (Быт. 37). Позже туда переселилась вся семья."}},{"id":"w2l3","title":"Свиток и недельная глава","steps":[{"he":"ספר תורה","h":"Свиток, написанный рукой","p":"Сефер Тора, свиток Торы, пишется от руки на пергаменте из кожи кошерного животного. Пишет его софер, то есть писец, обученный законам письма. Работает он пером и особыми чернилами, а листы сшивают в один свиток. Печатный свиток для чтения в синагоге не годится."},{"he":"פרשה","h":"Пятьдесят четыре главы","p":"Тору делят на 54 недельные главы. Глава называется параша, во множественном числе парашот. За год читают всю Тору, от Бытия до Второзакония. В большинстве лет суббот на все главы не хватает, и некоторые короткие главы читают сдвоенными. В праздник Симхат Тора дочитывают последние стихи и сразу начинают Тору заново."},{"he":"הפטרה","h":"Когда читают и что добавляют","p":"Полностью недельную главу читают в синагоге утром в Шаббат. По понедельникам и четвергам утром читают короткий отрывок: начало главы ближайшей субботы. После чтения Торы в Шаббат и в праздники читают хафтару: отрывок из книг Пророков, обычно связанный с темой недельной главы."}],"check":{"q":"Что происходит с чтением Торы в праздник Симхат Тора?","opts":["Читают только Десять речений","Чтение Торы прерывают на месяц","Дочитывают Тору и сразу начинают заново","Читают только книги Пророков"],"a":2,"why":"В Симхат Тора завершают годовой цикл последними стихами Второзакония и тут же начинают с первых слов Бытия."}},{"id":"w2l4","title":"Как читать текст","steps":[{"he":"פרדס","h":"Четыре уровня","p":"Средневековые толкователи описали четыре уровня смысла. Их первые буквы складываются в слово ПаРДеС, «сад». Пшат — простой, прямой смысл текста. Ремез — намёк. Дераш — толкование, которое ищет в тексте нравственный и религиозный урок. Сод — тайный, мистический смысл. Один и тот же стих можно читать на всех уровнях."},{"he":"רש״י","h":"Раши и мидраш","p":"Раши — это сокращение от «рабби Шломо Ицхаки». Он жил в городе Труа во Франции в 1040–1105 годах и написал комментарии почти ко всем книгам Танаха и к Талмуду. Раши стремился объяснить простой смысл стиха, но охотно приводил и мидраш. Мидраш — это толкования мудрецов, которые заполняют пробелы в тексте и выводят из него законы и уроки."},{"h":"Перевод и наука","p":"Септуагинта — древнейший известный перевод еврейской Библии на греческий. По мнению историков, Тору перевели в Александрии в III веке до н. э. Название значит «семьдесят»: по легенде, переводчиков было 72. Есть и современный научный подход: он изучает, когда и из каких источников мог сложиться текст. Традиция же видит в Торе откровение, данное Моше."}],"check":{"q":"Что в ПаРДеСе означает «пшат»?","opts":["Тайный, мистический смысл","Намёк, скрытый в тексте","Нравственный урок","Простой, прямой смысл текста"],"a":3,"why":"Пшат — первый уровень, простой смысл. Намёк называется ремез, урок называется дераш, тайный смысл называется сод."}}],"quiz":[{"q":"Из каких частей состоит Танах?","opts":["Тора, Мишна и Талмуд","Тора, Невиим и Ктувим","Тора, Мидраш и Галаха","Тора, Псалмы и Хроники"],"a":1,"why":"Танах — аббревиатура из первых букв трёх частей: Тора, Невиим (Пророки), Ктувим (Писания)."},{"q":"Как двенадцать коротких пророческих книг считаются в еврейском счёте книг Танаха?","opts":["Как одну книгу «Двенадцать»","Как двенадцать книг","Как часть Торы","Как часть Писаний"],"a":0,"why":"Их издавна писали на одном свитке, поэтому они считаются одной книгой среди поздних Пророков."},{"q":"Кто, по книге Бытия, получил второе имя Израиль?","opts":["Авраам","Ицхак","Яаков","Йосеф"],"a":2,"why":"Второе имя Израиль получает Яаков, отец двенадцати сыновей. Отсюда «Бней Исраэль», сыновья Израиля."},{"q":"Где, по книге Исход, народ после выхода из Египта получает Десять речений?","opts":["В Иерусалиме, в Храме","В Вавилоне","В земле Ханаан","У горы Синай"],"a":3,"why":"После казней и перехода через море народ приходит к горе Синай и получает Десять речений (Исх. 19–20)."},{"q":"Кто пишет свиток Торы?","opts":["Софер, обученный писец","Типограф на печатном станке","Любой член общины по очереди","Кантор во время молитвы"],"a":0,"why":"Сефер Тора пишется от руки на пергаменте писцом-софером, который знает законы письма."},{"q":"Что такое хафтара?","opts":["Половина недельной главы","Отрывок из книг Пророков после чтения Торы","Молитва перед чтением Торы","Название свитка Торы"],"a":1,"why":"Хафтара — отрывок из Пророков, обычно связанный по теме с недельной главой."},{"q":"Чем известен Раши?","opts":["Он перевёл Тору на греческий","Он разделил Тору на 54 главы","Он написал комментарии к Танаху и Талмуду","Он составил книгу Псалмов"],"a":2,"why":"Раши (1040–1105) из французского Труа написал комментарии почти ко всем книгам Танаха и к Талмуду."},{"q":"Что такое Септуагинта?","opts":["Древний перевод еврейской Библии на греческий","Сборник мидрашей","Четвёртый уровень толкования","Свиток с книгами Пророков"],"a":0,"why":"Септуагинта — древнейший греческий перевод; по мнению историков, Тору перевели в Александрии в III веке до н. э."}],"cards":[{"id":"w2c1","he":"תנ״ך","term":"Танах","def":"Еврейская Библия. Аббревиатура трёх частей: Тора, Невиим, Ктувим. По еврейскому счёту 24 книги."},{"id":"w2c2","he":"נביאים","term":"Невиим","def":"«Пророки», вторая часть Танаха. Ранние пророки рассказывают историю, поздние передают речи пророков."},{"id":"w2c3","he":"כתובים","term":"Ктувим","def":"«Писания», третья часть Танаха: Псалмы, Притчи, Иов, Рут, Эстер и другие книги."},{"id":"w2c4","he":"תרי עשר","term":"Трей Асар","def":"«Двенадцать». Двенадцать коротких пророческих книг, которые писали на одном свитке и считают одной книгой."},{"id":"w2c5","he":"ספר תורה","term":"Сефер Тора","def":"Свиток Торы, написанный от руки на пергаменте. Из него читают в синагоге."},{"id":"w2c6","he":"סופר","term":"Софер","def":"Писец, обученный законам письма. Пишет свитки Торы пером и особыми чернилами."},{"id":"w2c7","he":"פרשה","term":"Параша","def":"Недельная глава Торы. Всего их 54, за год прочитывают всю Тору. Мн. ч. парашот."},{"id":"w2c8","he":"הפטרה","term":"Хафтара","def":"Отрывок из книг Пророков, который читают после чтения Торы в Шаббат и в праздники."},{"id":"w2c9","he":"פרדס","term":"ПаРДеС","def":"«Сад». Аббревиатура четырёх уровней толкования: пшат, ремез, дераш, сод."},{"id":"w2c10","he":"פשט","term":"Пшат","def":"Простой, прямой смысл текста. Первый уровень ПаРДеСа."},{"id":"w2c11","he":"מדרש","term":"Мидраш","def":"Толкования мудрецов, которые заполняют пробелы в тексте Торы и выводят из него законы и уроки."},{"id":"w2c12","he":"רש״י","term":"Раши","def":"Рабби Шломо Ицхаки (1040–1105) из Труа, автор комментариев к Танаху и Талмуду, объяснявший простой смысл текста."}],"sources":[{"title":"Encyclopaedia Britannica: Tanakh","url":"https://www.britannica.com/topic/Tanakh"},{"title":"Posen Library: From Collection to Canon. The Emergence of the Bible/Tanakh","url":"https://www.posenlibrary.com/node/11666"},{"title":"Britannica (Student): Bible","url":"https://kids.britannica.com/students/article/Bible/273205"},{"title":"Encyclopaedia Britannica: Genesis","url":"https://www.britannica.com/topic/Genesis-Old-Testament"},{"title":"Jewish Encyclopedia: Exodus, Book of","url":"https://www.jewishencyclopedia.com/articles/5940-exodus-book-of"},{"title":"My Jewish Learning: Torah Scroll","url":"https://www.myjewishlearning.com/article/torah-scroll/"},{"title":"Judaism 101: Torah Readings","url":"https://jewfaq.org/readings.htm"},{"title":"Encyclopaedia Britannica: Peshat","url":"https://www.britannica.com/topic/peshat"},{"title":"Jewish Virtual Library: Rabbi Shlomo Yitzchaki (Rashi)","url":"https://www.jewishvirtuallibrary.org/rabbi-shlomo-yitzchaki-rashi"},{"title":"Livius: Septuagint","url":"https://www.livius.org/sources/about/septuagint/"}]},{"n":3,"letter":"ג","title":"Первый Храм","he":"בית ראשון","desc":"От праотцев до царей и пророков","lessons":[{"id":"w3l1","title":"От праотцев к земле","steps":[{"he":"שבטים","h":"Праотцы и двенадцать колен","p":"По рассказу Торы, история народа начинается с трёх праотцев: Авраама, его сына Ицхака (Исаака) и внука Яакова (Иакова). Яаков получил второе имя Израиль. У него было двенадцать сыновей, и от них, по Торе, произошли двенадцать колен, то есть родов народа Израиля.","verse":{"he":"כל אלה שבטי ישראל שנים עשר","ru":"«Всё это — колена Израиля, двенадцать» (Быт. 49:28)"}},{"h":"Исход, Йегошуа и судьи","p":"По рассказу Библии, потомки Яакова попали в рабство в Египте, Моше (Моисей) вывел их на свободу, а его преемник Йегошуа (Иисус Навин) перевёл народ через Иордан и начал завоевание страны с Иерихона. Потом коленами руководили судьи (шофтим), местные вожди и воины. Среди них была пророчица Двора (Девора). Судьёй был и Шмуэль (Самуил), при котором появился первый царь."},{"he":"ישראל","h":"Что говорит археология","p":"Первое известное упоминание «Израиля» вне Библии — египетская стела фараона Мернептаха, около 1208 г. до н. э. Там сказано, что Израиль «опустошён». Значит, по мнению большинства учёных, народ с этим именем тогда уже жил в Ханаане. Как рассказ об исходе и завоевании соотносится с находками, историки спорят: одни видят в нём историческое ядро, другие — постепенное расселение, третьи отвергают его историчность. Традиция принимает рассказ Торы как историю."}],"check":{"q":"Где находится первое известное упоминание «Израиля» вне Библии?","opts":["На стеле Мернептаха","В Вавилонском Талмуде","В письме Иеремии","На стенах Первого Храма"],"a":0,"why":"Это египетская стела фараона Мернептаха, около 1208 г. до н. э. Точный год учёные называют с расхождением в год-два."}},{"id":"w3l2","title":"Цари: Шауль, Давид, Шломо","steps":[{"he":"מלך","h":"Первый царь и Давид","p":"По рассказу Библии, судья Шмуэль помазал на царство Шауля (Саула) из колена Биньямина. Он стал первым царём Израиля и воевал с филистимлянами. После него царём стал Давид. По мнению историков, Давид жил около 1000 г. до н. э. По Библии, он взял Иерусалим, сделал его столицей и перенёс туда ковчег завета."},{"he":"בית ראשון","h":"Шломо строит Храм","p":"По рассказу Библии, сын Давида Шломо (Соломон) построил в Иерусалиме Храм, который теперь называют Первым. Историки обычно относят его царствование к X в. до н. э. Почти всё, что мы знаем о Шломо, взято из Библии, и археологи спорят, насколько велико было его царство. По Талмуду, Первый Храм простоял 410 лет (Йома 9а)."},{"h":"Два царства","p":"По рассказу Библии, после смерти Шломо царство раскололось. Северные колена отвергли его сына Рехавама (Ровоама) и пошли за Яровамом (Иеровоамом): так возникло северное Израильское царство. На юге, с Иерусалимом и Храмом, осталось Иудейское царство потомков Давида. Около 722 г. до н. э. Ассирия разгромила Израильское царство и увела часть жителей в плен."}],"check":{"q":"Какая держава около 722 г. до н. э. разгромила северное Израильское царство?","opts":["Египет","Ассирия","Вавилон","Персия"],"a":1,"why":"Северное царство пало под ударом Ассирии около 722 г. до н. э. Вавилон позже, в 586 (по другим расчётам 587) г. до н. э., разрушил Иерусалим."}},{"id":"w3l3","title":"Пророки","steps":[{"he":"נביא","h":"Не только предсказатель","p":"Пророк (нави) в Танахе прежде всего посланник Б-га. Он обличает, предостерегает и зовёт вернуться к правильной жизни. Предсказания будущего лишь часть его роли. Элиягу (Илия) выступал против служения Баалу при царе Ахаве. Когда Ахав присвоил виноградник Навота, убитого по ложному обвинению, Элиягу пришёл к царю с обличением."},{"h":"Справедливость к слабым","p":"В VIII в. до н. э. Амос из Текоа пришёл в северное царство и обличал богатых, которые угнетали бедных и при этом приносили пышные жертвы. Йешаягу (Исаия) в Иерусалиме призывал защищать сироту и вступаться за вдову (Ис. 1:17). Позже Ирмеягу (Иеремия) предупреждал Иудею о бедствии.","verse":{"he":"ויגל כמים משפט וצדקה כנחל איתן","ru":"«Пусть правосудие катится, как вода, а праведность, как неиссякающий поток» (Амос 5:24)"}},{"he":"חסד","h":"Два знаменитых стиха","p":"Йешаягу говорит о времени, когда народы перекуют мечи на орала, а копья на садовые ножи и больше не будут учиться войне (Ис. 2:4). Пророк Миха (Михей) в одном стихе отвечает, чего Б-г ждёт от человека: творить правосудие, любить милосердие (хесед) и скромно ходить перед Б-гом.","verse":{"he":"כי אם עשות משפט ואהבת חסד והצנע לכת עם אלהיך","ru":"«Только творить правосудие, любить милосердие и скромно ходить с твоим Б-гом» (Миха 6:8)"}}],"check":{"q":"В чём, по Танаху, прежде всего роль пророка (нави)?","opts":["Гадание о судьбе отдельных людей","Управление Храмом","Обличать и звать вернуться к правильной жизни","Командование войском"],"a":2,"why":"Пророк — посланник, который обличает и зовёт к правильной жизни. Предсказание будущего лишь одна из сторон его роли."}},{"id":"w3l4","title":"Падение Иудеи","steps":[{"he":"חורבן","h":"Вавилон и разрушение","p":"В 597 г. до н. э. вавилонский царь Навуходоносор взял Иерусалим и увёл в Вавилон царя и знать. Новый царь Цидкияу (Седекия) восстал, и вавилонское войско вернулось. Иерусалим был разрушен, а Храм сожжён. По принятой у историков хронологии это 586 г. до н. э., некоторые называют 587 год. По традиционной хронологии (книга «Седер олам») это 422 г. до н. э., то есть примерно на 165 лет позже."},{"he":"גלות","h":"На реках вавилонских","p":"Начался вавилонский плен (галут, изгнание). Псалом 137 передаёт плач изгнанников и клятву не забыть Иерусалим. Ирмеягу же написал пленникам письмо (Иер. 29): стройте дома, сажайте сады, женитесь и молитесь о благополучии города, где вы живёте. Он обещал возвращение через семьдесят лет. Около 538 г. до н. э. персидский царь Кореш (Кир) разрешил евреям вернуться.","verse":{"he":"על נהרות בבל שם ישבנו גם בכינו בזכרנו את ציון","ru":"«У рек Вавилона там сидели мы и плакали, вспоминая Сион» (Пс. 137:1)"}},{"he":"תשעה באב","h":"Тиша бе-Ав","p":"Тиша бе-Ав, девятое число месяца ав, — день траура по разрушению Первого и Второго Храмов. Это пост примерно на сутки, от заката до наступления темноты на следующий день. В синагоге читают книгу Эйха (Плач Иеремии), которую традиция приписывает Ирмеягу. Многие сидят на низких скамьях, как скорбящие. С этим днём связывают и другие беды еврейской истории."}],"check":{"q":"Что советовал Ирмеягу пленникам в Вавилоне в своём письме?","opts":["Сразу бежать обратно в Иудею","Поднять восстание против Вавилона","Строить дома и молиться о благополучии города","Отказаться от своих обычаев"],"a":2,"why":"В Иер. 29 пророк велит строить дома, сажать сады, заводить семьи и молиться о благополучии города, куда их изгнали."}}],"quiz":[{"q":"От кого, по Торе, произошли двенадцать колен Израиля?","opts":["От двенадцати сыновей Яакова","От двенадцати судей","От двенадцати пророков","От двенадцати царей Иудеи"],"a":0,"why":"У Яакова, которого также зовут Израиль, было двенадцать сыновей, предков колен (Быт. 49:28)."},{"q":"Как историки относятся к рассказу об исходе и завоевании Ханаана?","opts":["Единогласно считают его выдумкой","Единогласно считают его точной хроникой","Спорят, и единого мнения нет","Не изучают его вообще"],"a":2,"why":"Одни видят в рассказе историческое ядро, другие постепенное расселение, третьи отвергают его историчность. Традиция принимает рассказ Торы как историю."},{"q":"По рассказу Библии, какой город Давид взял и сделал своей столицей?","opts":["Шхем","Самарию","Иерихон","Иерусалим"],"a":3,"why":"По рассказу Библии, Давид взял Иерусалим, сделал его столицей и перенёс туда ковчег завета."},{"q":"По рассказу Библии, какое царство осталось за потомками Давида после раскола?","opts":["Северное Израильское","Южное Иудейское с Иерусалимом","Ассирийское","Египетское"],"a":1,"why":"Северные колена пошли за Яровамом, а Иудея с Иерусалимом и Храмом осталась за династией Давида."},{"q":"Какой пророк, по рассказу Библии, выступал против служения Баалу при царе Ахаве?","opts":["Амос","Ирмеягу","Элиягу","Миха"],"a":2,"why":"Элиягу (Илия) спорил с Ахавом о служении Баалу и обличил его за виноградник Навота."},{"q":"Что, по стиху Михи 6:8, Б-г ждёт от человека?","opts":["Творить правосудие, любить милосердие и скромно ходить перед Б-гом","Приносить как можно больше жертв","Строить дворцы и крепости","Знать наизусть все законы"],"a":0,"why":"Миха сводит ответ к трём вещам: правосудию, милосердию (хесед) и скромности перед Б-гом."},{"q":"Когда Вавилон разрушил Иерусалим и Первый Храм, по мнению историков?","opts":["Около 1208 г. до н. э.","Около 722 г. до н. э.","Около 538 г. до н. э.","В 586 г. до н. э. (некоторые называют 587)"],"a":3,"why":"Историки называют 586 или 587 год. Около 722 г. до н. э. пало северное царство, а около 538 г. до н. э. Кир разрешил вернуться."},{"q":"Что вспоминают в Тиша бе-Ав?","opts":["Выход из Египта","Разрушение Первого и Второго Храмов","Освящение Храма Шломо","Дарование Торы"],"a":1,"why":"Девятое ава — день траура и поста по двум разрушенным Храмам. В этот день читают книгу Эйха."}],"cards":[{"id":"w3c1","he":"שבטי ישראל","term":"Шивтей Исраэль","def":"Двенадцать колен Израиля. По Торе, они происходят от двенадцати сыновей Яакова."},{"id":"w3c2","he":"שופטים","term":"Шофтим","def":"Судьи: вожди и воины колен после Йегошуа и до первых царей. Среди них пророчица Двора и Шмуэль."},{"id":"w3c3","he":"מצבת מרנפתח","term":"Стела Мернептаха","def":"Египетская надпись около 1208 г. до н. э. с первым известным упоминанием «Израиля» вне Библии."},{"id":"w3c4","he":"בית ראשון","term":"Байит ришон","def":"Первый Храм в Иерусалиме, построенный Шломо (Соломоном). По мнению историков, разрушен Вавилоном в 586 г. до н. э. (по другим расчётам в 587)."},{"id":"w3c5","he":"ירושלים","term":"Йерушалаим","def":"Иерусалим. По Библии, Давид сделал его столицей, а Шломо построил здесь Храм."},{"id":"w3c6","he":"ממלכת יהודה","term":"Мамлехет Йегуда","def":"Южное Иудейское царство после раскола. Столица Иерусалим, цари из потомков Давида."},{"id":"w3c7","he":"ממלכת ישראל","term":"Мамлехет Исраэль","def":"Северное Израильское царство после раскола. Разгромлено Ассирией около 722 г. до н. э."},{"id":"w3c8","he":"נביא","term":"Нави","def":"Пророк: посланник Б-га, который обличает, предостерегает и зовёт к справедливости. Предсказание будущего лишь часть его роли."},{"id":"w3c9","he":"חסד","term":"Хесед","def":"Милосердие, доброта. Одно из трёх требований в стихе Михи 6:8."},{"id":"w3c10","he":"גלות","term":"Галут","def":"Изгнание, жизнь народа вне своей земли. Вавилонский плен начался после взятия Иерусалима."},{"id":"w3c11","he":"תשעה באב","term":"Тиша бе-Ав","def":"Девятое ава. День поста и траура по разрушению Первого и Второго Храмов."},{"id":"w3c12","he":"איכה","term":"Эйха","def":"Книга «Плач Иеремии». Её читают в Тиша бе-Ав, традиция приписывает её пророку Ирмеягу."}],"sources":[{"title":"Britannica: Israel Stela","url":"https://www.britannica.com/topic/Israel-Stela"},{"title":"My Jewish Learning: Exodus: History or Mythic Tale?","url":"https://www.myjewishlearning.com/article/exodus-history-or-mythic-tale/"},{"title":"My Jewish Learning: Conquering Canaan","url":"https://www.myjewishlearning.com/article/conquering-canaan/"},{"title":"Britannica: Solomon","url":"https://www.britannica.com/biography/Solomon"},{"title":"Jewish Virtual Library: Jerusalem in the First Temple Period","url":"https://jewishvirtuallibrary.org/jerusalem-in-the-first-temple-period"},{"title":"Jewish Virtual Library: Hosea and Amos","url":"https://jewishvirtuallibrary.org/jsource/Judaism/Hosea_Amos.html"},{"title":"Jewish Virtual Library (Encyclopaedia Judaica): Exile, Babylonian","url":"https://jewishvirtuallibrary.org/jsource/judaica/ejud_0002_0006_0_06183.html"},{"title":"Chabad.org: The Discrepancy Between the Rabbinic and Secular Dates","url":"https://www.chabad.org/library/article_cdo/aid/2836156/jewish/The-Discrepancy-Between-the-Rabbinic-and-Secular-Dates.htm"},{"title":"ReformJudaism.org: Tishah B'Av","url":"https://reformjudaism.org/jewish-holidays/tishah-bav"},{"title":"Britannica: Babylonian Exile","url":"https://www.britannica.com/event/Babylonian-Exile"}]},{"n":4,"letter":"ד","title":"Второй Храм","he":"בית שני","desc":"Возвращение, разрушение, начало диаспоры","lessons":[{"id":"w4l1","title":"Возвращение","steps":[{"he":"כורש","h":"Кореш берёт Вавилон","p":"В 539 году до н. э. персидский царь Кореш (Кир Великий) взял Вавилон. Глиняный «цилиндр Кира», найденный в Вавилоне, сообщает, что Кореш вернул домой депортированные народы и их святыни; евреи там прямо не названы. Книга Эзры (Ездры) рассказывает, что Кореш разрешил евреям вернуться в Иерусалим и отстроить Храм (Эзра 1). Вернулись не все: большая община осталась в Вавилонии."},{"he":"בית שני","h":"Второй Храм","p":"Храм отстраивали долго. По книге Эзры (6:15), его завершили третьего числа месяца адар, на шестой год царя Дарьявеша (Дария). Историки соотносят эту дату с 516 или 515 годом до н. э. Так начинается эпоха Второго Храма, которая продлится почти шесть веков, до 70 года н. э."},{"h":"Эзра читает Тору","verse":{"he":"ויקראו בספר בתורת האלהים מפרש ושום שכל ויבינו במקרא","ru":"«И читали в книге, в Торе Б-жьей, внятно, и объясняли смысл, и поняли прочитанное» (Нехемия 8:8)"},"p":"Нехемия (Неемия) служил при дворе персидского царя Артахшасты (Артаксеркса) и попросил разрешения отстроить Иерусалим; стену, по его книге, закончили за 52 дня. В первый день седьмого месяца народ собрался у Водяных ворот, и Эзра, священник и книжник, читал Тору с утра до полудня, а левиты, служители Храма, объясняли."}],"check":{"q":"Кто, по книге Нехемии, публично читал Тору народу у Водяных ворот?","opts":["Нехемия","Кореш","Эзра","Дарьявеш"],"a":2,"why":"Эзра, священник и книжник, читал Тору с утра до полудня, а левиты объясняли смысл (Нехемия 8)."}},{"id":"w4l2","title":"Эллинизм и Хасмонеи","steps":[{"h":"Греки приходят на Восток","p":"В 330-е годы до н. э. Александр Македонский разгромил Персидскую державу, и Иудея оказалась в греческом мире. После его смерти империю поделили полководцы. Сначала Иудеей правили Птолемеи из Египта, а около 200 года до н. э. её захватили Селевкиды, цари со столицей в Сирии. Греческий язык и образ жизни, эллинизм, привлекали часть евреев."},{"he":"מכבים","h":"Восстание Маккавеев","p":"Селевкидский царь Антиох IV запретил соблюдать еврейские законы и осквернил Храм. В 167 году до н. э. в селении Модиин священник Матитьяху (Маттафия) отказался приносить языческую жертву и поднял восстание. Его сын Йегуда Маккавей (Иуда Маккавей) вернул Храм и 25-го числа месяца кислев освятил его заново. Обычно это датируют 164 годом до н. э., встречается и 165-й."},{"he":"חנוכה","h":"Ханука: два рассказа","p":"Первая книга Маккавеев говорит, что освящение праздновали восемь дней и постановили отмечать его каждый год; о чуде с маслом там нет ни слова. Рассказ о масле есть в Талмуде (Шаббат 21б): нашли один кувшин с печатью первосвященника, его хватало на день, а горело восемь. Семья стала династией Хасмонеев; её независимому правлению положил конец Рим в 63 году до н. э."}],"check":{"q":"В каком источнике рассказана история о кувшине масла, горевшем восемь дней?","opts":["В Первой книге Маккавеев","В Талмуде, трактат Шаббат 21б","В книге Нехемии","На цилиндре Кира"],"a":1,"why":"Первая книга Маккавеев описывает восьмидневное освящение Храма без чуда с маслом. Рассказ о масле приводит Талмуд."}},{"id":"w4l3","title":"Рим и течения","steps":[{"h":"Ирод и его Храм","p":"В 63 году до н. э. римский полководец Помпей взял Иерусалим. С 37 года до н. э. Иудеей правил Ирод Великий, царь, поставленный Римом. Он строил крепости, среди них Масаду, и около 20–19 годов до н. э. начал перестраивать Храм. Работы на храмовом комплексе шли ещё десятилетия."},{"he":"פרושים","h":"Три течения","p":"Иосиф Флавий, иудейский историк I века н. э., описывает три течения. Фарисеи (прушим) считали Устную Тору, устное объяснение закона, такой же обязательной, как Письменную, и верили в посмертное воздаяние; в раввинской традиции их учение связано и с воскресением мёртвых. Саддукеи (цдуким), круг храмовых священников и знати, признавали только Письменную Тору и отвергали воскресение. Ессеи жили замкнутыми общинами. Сочинений саддукеев не сохранилось, о них судят по описаниям оппонентов, поэтому историки читают эти описания осторожно."},{"he":"בית כנסת","h":"Свитки и синагога","p":"В 1947 году бедуинский пастух нашёл в пещере у Кумрана, у Мёртвого моря, древние свитки. Среди них рукописи книг Танаха, например полный свиток Исаии. Многие учёные связывают кумранскую общину с ессеями, но это обсуждается. В эпоху Второго Храма уже были синагоги. Само слово греческое и значит «собрание», на иврите «бейт кнесет». Там читали и изучали Тору и собирались общиной."}],"check":{"q":"Какое течение, по описаниям того времени, признавало только Письменную Тору?","opts":["Фарисеи","Ессеи","Маккавеи","Саддукеи"],"a":3,"why":"Саддукеи отвергали Устную Тору и воскресение мёртвых. Фарисеи считали Устную Тору обязательной."}},{"id":"w4l4","title":"Разрушение","steps":[{"he":"תשעה באב","h":"Великое восстание","p":"В 66 году н. э. Иудея восстала против Рима. Летом 70 года войска Тита, сына императора Веспасиана, взяли Иерусалим, и Храм сгорел. По Иосифу Флавию, Тит не хотел уничтожать Храм; многие историки в этом сомневаются. По традиции, оба Храма пали 9 ава, в Тиша бе-Ав (Мишна Таанит 4:6). Последней пала крепость Масада, в 73 или 74 году. По Иосифу Флавию, её защитники предпочли смерть плену."},{"he":"יבנה","h":"Явне","p":"Талмуд (Гиттин 56а–56б) рассказывает: во время осады ученики вынесли Рабана Йоханана бен Закая из города под видом покойника. Он пришёл к Веспасиану и среди прочего попросил: «Дай мне Явне и его мудрецов». Похожий рассказ есть в «Авот де-рабби Натан». Это поздние раввинские тексты, и многие историки считают рассказ преданием. Но именно в Явне мудрецы продолжили учить Тору, и иудаизм смог жить без Храма."},{"he":"גלות","h":"Бар-Кохба и галут","p":"В 132–135 годах н. э. шло восстание Бар-Кохбы. Его подавили, последней пала крепость Бейтар. Адриан основал на месте Иерусалима римский город Элию Капитолину (историки спорят, до восстания или после), а евреям, по сообщениям древних авторов, запретили жить в нём. Провинцию переименовали из Иудеи в Сирию-Палестину. Но диаспора, жизнь евреев вне Земли Израиля, началась раньше: большие общины давно жили в Вавилонии и Александрии. Утрату родины традиция называет словом «галут», изгнание."}],"check":{"q":"Что, по Талмуду, попросил Рабан Йоханан бен Закай у Веспасиана?","opts":["Отстроить Храм","«Дай мне Явне и его мудрецов»","Отдать ему Масаду","Отпустить всех пленных"],"a":1,"why":"Так рассказывает Гиттин 56б. Многие историки считают этот рассказ преданием, но Явне действительно стало центром учёбы после разрушения."}}],"quiz":[{"q":"Какой царь, взяв Вавилон в 539 году до н. э., по книге Эзры разрешил евреям вернуться?","opts":["Кореш (Кир Великий)","Навуходоносор","Антиох IV","Александр Македонский"],"a":0,"why":"Кореш взял Вавилон в 539 году до н. э. Книга Эзры (глава 1) приводит его указ о возвращении и строительстве Храма."},{"q":"Когда, по мнению историков, был завершён Второй Храм?","opts":["Около 586 года до н. э.","Около 444 года до н. э.","Около 164 года до н. э.","Около 516–515 годов до н. э."],"a":3,"why":"Эзра 6:15 называет шестой год царя Дарьявеша, что соответствует 516 или 515 году до н. э."},{"q":"Какое событие вспоминают в Хануку?","opts":["Возвращение из Вавилона","Новое освящение Храма после победы Маккавеев","Получение Торы на Синае","Постройку стены Иерусалима Нехемией"],"a":1,"why":"Йегуда Маккавей освятил Храм заново 25 кислева. Обычно это датируют 164 годом до н. э."},{"q":"Кто начал восстание против Антиоха IV в селении Модиин?","opts":["Ирод","Эзра","Священник Матитьяху (Маттафия)","Рабан Йоханан бен Закай"],"a":2,"why":"В 167 году до н. э. Матитьяху отказался приносить языческую жертву. Восстание продолжил его сын Йегуда Маккавей."},{"q":"Чем, по описаниям того времени, фарисеи отличались от саддукеев?","opts":["Считали Устную Тору такой же обязательной, как Письменную","Признавали только Письменную Тору","Считали необходимым жить в пустыне","Отказывались от Храма и праздников"],"a":0,"why":"Фарисеи считали Устную Тору обязательной, а саддукеи признавали только Письменную. Сочинений саддукеев не сохранилось, их взгляды известны по описаниям оппонентов."},{"q":"Что значит слово «синагога»?","opts":["«Храм»","«Свиток»","«Святилище»","«Собрание»"],"a":3,"why":"Слово греческое и значит «собрание». На иврите синагога называется «бейт кнесет», дом собрания."},{"q":"Кто командовал римлянами при взятии Иерусалима в 70 году н. э.?","opts":["Помпей","Адриан","Тит","Кореш"],"a":2,"why":"Тит, сын Веспасиана, взял Иерусалим летом 70 года. Помпей взял город раньше, в 63 году до н. э., а Адриан подавил восстание Бар-Кохбы."},{"q":"Как назывался римский город, который Адриан основал на месте Иерусалима?","opts":["Сирия-Палестина","Элия Капитолина","Кесария","Явне"],"a":1,"why":"Город стал Элией Капитолиной, а Сирией-Палестиной назвали всю провинцию вместо Иудеи. Историки спорят о точных датах этих перемен."}],"cards":[{"id":"w4c1","he":"בית שני","term":"Байит шени","def":"Второй Храм в Иерусалиме. Завершён около 516–515 годов до н. э., сожжён римлянами в 70 году н. э."},{"id":"w4c2","he":"חנוכה","term":"Ханука","def":"«Освящение». Восьмидневный праздник с 25 кислева в память о новом освящении Храма Маккавеями."},{"id":"w4c3","he":"מכבים","term":"Маккавеи","def":"Семья священника Матитьяху и его сыновей, поднявшая восстание против Антиоха IV в 167 году до н. э. Название идёт от прозвища Йегуды Маккавея."},{"id":"w4c4","he":"חשמונאים","term":"Хасмонеи","def":"Династия, выросшая из семьи Маккавеев. Правила Иудеей до вмешательства Рима в 63 году до н. э."},{"id":"w4c5","he":"פרושים","term":"Прушим (фарисеи)","def":"Течение эпохи Второго Храма. Считали Устную Тору обязательной; по раввинской традиции, верили в воскресение мёртвых."},{"id":"w4c6","he":"צדוקים","term":"Цдуким (саддукеи)","def":"Течение храмовых священников и знати. Признавали только Письменную Тору, отвергали воскресение мёртвых. Исчезли после 70 года н. э."},{"id":"w4c7","he":"איסיים","term":"Исиим (ессеи)","def":"Течение эпохи Второго Храма, жившее замкнутыми общинами. Многие учёные связывают с ними Кумран."},{"id":"w4c8","he":"בית כנסת","term":"Бейт кнесет","def":"«Дом собрания», синагога. Место, где читают и изучают Тору, молятся и собираются общиной."},{"id":"w4c9","he":"יבנה","term":"Явне","def":"Город, где после разрушения Храма Рабан Йоханан бен Закай и мудрецы продолжили учить Тору."},{"id":"w4c10","he":"מצדה","term":"Мецада (Масада)","def":"Крепость Ирода у Мёртвого моря. Последний оплот восставших, пала в 73 или 74 году н. э."},{"id":"w4c11","he":"תשעה באב","term":"Тиша бе-Ав","def":"9 ава, день траура. По традиции, в этот день разрушены оба Храма и пал Бейтар."},{"id":"w4c12","he":"גלות","term":"Галут","def":"Изгнание. Так называют жизнь народа вне Земли Израиля после утраты родины, прежде всего после разрушения Второго Храма."}],"sources":[{"title":"British Museum: The Cyrus Cylinder","url":"https://www.britishmuseum.org/collection/object/W_1880-0617-1941"},{"title":"Sefaria: Nehemiah 8","url":"https://www.sefaria.org/Nehemiah.8"},{"title":"Sefaria: Shabbat 21b","url":"https://www.sefaria.org/Shabbat.21b"},{"title":"Center for Online Judaic Studies: 1 Maccabees 4–6, The Rededication of the Temple","url":"https://cojs.org/?p=4426"},{"title":"Encyclopaedia Britannica: Synagogue","url":"https://www.britannica.com/topic/synagogue"},{"title":"My Jewish Learning: Let’s Talk About Sects","url":"https://www.myjewishlearning.com/article/lets-talk-about-sects/"},{"title":"Leon Levy Dead Sea Scrolls Digital Library: Discovery and Publication","url":"https://www.deadseascrolls.org.il/learn-about-the-scrolls/discovery-and-publication"},{"title":"Encyclopaedia Britannica: Judaism, the Temple and the synagogues","url":"https://britannica.com/topic/Judaism/Religious-rites-and-customs-in-Palestine-the-Temple-and-the-synagogues"},{"title":"Jewish Virtual Library: The Bar-Kokhba Revolt","url":"https://www.jewishvirtuallibrary.org/the-bar-kokhba-revolt-132-135-ce"},{"title":"EBSCO Research Starters: Johanan ben Zakkai","url":"https://www.ebsco.com/research-starters/biography/johanan-ben-zakkai/"}]},{"n":5,"letter":"ה","title":"Талмуд","he":"תלמוד","desc":"Устная Тора, Мишна, Гемара и искусство спора","lessons":[{"id":"w5l1","title":"Устная Тора","steps":[{"he":"תורה שבעל פה","h":"Две Торы","p":"По традиции у Синая Моше (Моисей) получил не только письменный текст Торы, но и устное объяснение к нему. Его называют «Тора ше-бе-аль пе», Устная Тора. Трактат Мишны Пиркей Авот начинается так: «Моше получил Тору с Синая и передал её Йегошуа (Иисусу Навину)», а тот передал старейшинам, и цепочка шла дальше (Пиркей Авот 1:1)."},{"h":"Зачем нужно объяснение","verse":{"he":"עין תחת עין שן תחת שן יד תחת יד רגל תחת רגל","ru":"«Глаз за глаз, зуб за зуб, рука за руку, нога за ногу» (Исх. 21:24)"},"p":"Если читать стих буквально, он требует отомстить тем же увечьем. Но Гемара в трактате Бава Кама (83б) отвергает такое прочтение: виновный платит пострадавшему деньги. Так этот закон понимает раввинская традиция. Пример показывает, как сильно смысл стиха зависит от устного толкования."},{"h":"Таннаи и амораи","p":"Эпоху мудрецов Мишны и Талмуда делят на два периода. Таннаи («учителя») — это мудрецы, чьи слова записаны в Мишне. Их эпоха длилась около двух веков и закончилась в начале III века н. э. Амораи — мудрецы, которые после них, примерно с 200 до 500 г. н. э., обсуждали Мишну в академиях Страны Израиля и Вавилонии. Их обсуждения легли в основу Гемары."}],"check":{"q":"Что, по традиции, Моше получил у Синая вместе с письменной Торой?","opts":["Устное объяснение к ней","Готовый текст Талмуда","Комментарий Раши","Список трактатов Мишны"],"a":0,"why":"По традиции вместе с текстом было дано устное объяснение, Тора ше-бе-аль пе. Талмуд и Раши появились много веков спустя."}},{"id":"w5l2","title":"Мишна","steps":[{"he":"משנה","h":"Устное учение записано","p":"После разрушения Второго Храма устное учение собрали и отредактировали. Около 200 г. н. э. эту работу завершил рабби Йегуда ха-Наси (Иуда Князь). Так появилась Мишна: первый большой свод раввинского права. Она стала основой, на которой построен весь Талмуд."},{"he":"שישה סדרים","h":"Шесть разделов","p":"Мишна делится на шесть седарим, разделов: Зраим (זרעים, «Семена») о земледелии и благословениях; Моэд (מועד, «Праздники») о субботе и праздниках; Нашим (נשים, «Женщины») о браке и семье; Незикин (נזיקין, «Ущербы») о гражданском и уголовном праве; Кодашим (קדשים, «Святыни») о жертвах и Храме; Тохорот (טהרות, «Чистота») о ритуальной чистоте. Разделы состоят из трактатов, масехтот: в принятом сейчас счёте их 63."},{"h":"Язык и голос меньшинства","p":"Мишна написана на мишнаитском иврите: это более поздняя форма иврита, чем библейский иврит. В ней много споров, и записаны не только решения, но и мнения меньшинства, хотя закон по ним не установлен. Сама Мишна объясняет, зачем: чтобы будущий суд, если сочтёт нужным, мог опереться на такое мнение (Мишна, трактат Эдуйот 1:5)."}],"check":{"q":"Сколько разделов (седарим) в Мишне?","opts":["Четыре","Шесть","Десять","Шестьдесят три"],"a":1,"why":"Разделов шесть: от Зраим до Тохорот. Число 63 — это трактаты внутри разделов."}},{"id":"w5l3","title":"Гемара и Талмуд","steps":[{"he":"גמרא","h":"Гемара и два Талмуда","p":"Гемара — это обсуждение Мишны, которое вели амораи. Мишна вместе с Гемарой составляет Талмуд. Гемара написана в основном на арамейском языке с вкраплениями иврита. Талмудов два: Иерусалимский сложился в Стране Израиля примерно к 400 г. н. э. Вавилонский в основном завершён около 500 г. н. э., хотя, по данным исследователей, его редактура продолжалась и позже. Главным стал Вавилонский."},{"he":"דף","h":"Как устроена страница","p":"В центре страницы Мишна и Гемара. На внутреннем поле, у переплёта, комментарий Раши (рабби Шломо Ицхаки, Франция, 1040–1105): он коротко объясняет слова и простой смысл. На внешнем поле Тосафот, «дополнения» учёных начиная с XII века, среди них зятья и внуки Раши. Лист называют даф, у него две стороны, а и б. «Бава Кама 83б» значит «лист 83, вторая сторона»."},{"he":"דף יומי","h":"Один лист в день","p":"В 1923 году на съезде движения Агудат Исраэль в Вене рабби Меир Шапиро предложил учить по одному листу Вавилонского Талмуда в день. Так появился Даф Йоми, «ежедневный лист». Цикл охватывает 2711 листов и занимает около семи с половиной лет."}],"check":{"q":"Где на странице Талмуда напечатан комментарий Раши?","opts":["В самом центре страницы","На внешнем поле","На внутреннем поле, у переплёта","В отдельном томе"],"a":2,"why":"Раши стоит на внутреннем поле. В центре Мишна и Гемара, на внешнем поле Тосафот."}},{"id":"w5l4","title":"Как устроен спор","steps":[{"he":"מחלוקת","h":"Спор ради Небес","p":"Махлокет значит «спор, разногласие». Мишна учит: «Всякий спор, который ради Небес, в конце концов устоит». И приводит пример: спор Гиллеля и Шаммая (Пиркей Авот 5:17). Спор ради Небес ведут ради истины, а не ради победы над соперником."},{"he":"אלו ואלו","h":"Гиллель и Шаммай","p":"Гиллель и Шаммай — современники, жившие на рубеже эр, во времена царя Ирода. Их школы, Бейт Гиллель и Бейт Шаммай, спорили более трёхсот раз. Талмуд рассказывает: после трёх лет спора голос с небес объявил, что и те, и другие говорят слова Б-га живого, но закон следует Бейт Гиллель. Причина: ученики Гиллеля были уживчивы и сдержанны, учили оба мнения и называли мнение Шаммая прежде своего (Эрувин 13б, пересказ). Мнения Шаммая тоже сохранены в тексте."},{"he":"חברותא","h":"Учиться вдвоём","p":"Хаврута (по-арамейски «товарищество») — это пара, которая учит текст вместе: читают, спорят, задают вопросы, проверяют друг друга. Вопрос здесь главный метод. Талмуд рассказывает, что рабби Йоханан ценил своего товарища по учёбе Реш Лакиша за то, что тот выдвигал на каждое его слово 24 возражения, а он отвечал на каждое 24 ответами, и от этого учение становилось шире (Бава Мециа 84а)."}],"check":{"q":"Почему, по рассказу в Эрувин 13б, закон следует Бейт Гиллель?","opts":["Их решения были строже","Они были старше Бейт Шаммай","Так решил царь Ирод","Они были сдержанны и называли мнение Шаммая прежде своего"],"a":3,"why":"Талмуд объясняет решение характером учеников Гиллеля: уживчивостью, сдержанностью и уважением к оппонентам. При этом обе стороны названы словами Б-га живого."}}],"quiz":[{"q":"Как раввинская традиция понимает закон «глаз за глаз»?","opts":["Как буквальное наказание тем же увечьем","Как денежную компенсацию пострадавшему","Как изгнание виновного","Как совет простить без последствий"],"a":1,"why":"Гемара (Бава Кама 83б) отвергает буквальное прочтение: виновный платит пострадавшему деньги."},{"q":"Кого называют таннаями?","opts":["Авторов комментария Тосафот","Учеников рабби Меира Шапиро","Мудрецов, чьи слова записаны в Мишне","Мудрецов, создавших Гемару в Вавилонии"],"a":2,"why":"Таннаи — мудрецы эпохи Мишны, до начала III века н. э. Гемару создавали следующие поколения, амораи."},{"q":"Кто около 200 г. н. э. завершил Мишну?","opts":["Гиллель","Раши","Рабби Йоханан","Рабби Йегуда ха-Наси"],"a":3,"why":"Мишну завершил рабби Йегуда ха-Наси. Гиллель жил раньше, рабби Йоханан был амораем, Раши жил в 1040–1105 годах."},{"q":"Зачем, по словам самой Мишны, в ней записаны мнения меньшинства?","opts":["Чтобы будущий суд мог при необходимости на них опереться","Чтобы закон всегда решали по меньшинству","Потому что их нельзя было забыть по закону","Чтобы заполнить пустое место"],"a":0,"why":"Так объясняет Мишна в трактате Эдуйот 1:5: суд может предпочесть мнение одного и опереться на него."},{"q":"На каком языке в основном написана Гемара?","opts":["На библейском иврите","На арамейском","На греческом","На латыни"],"a":1,"why":"Гемара написана в основном на арамейском с вкраплениями иврита. Мишна же написана на мишнаитском иврите."},{"q":"Что такое Даф Йоми?","opts":["Комментарий на внешнем поле страницы","Иерусалимский Талмуд","Раздел Мишны о праздниках","Учёба по одному листу Талмуда в день"],"a":3,"why":"Даф Йоми предложил рабби Меир Шапиро в 1923 году. Полный цикл занимает около семи с половиной лет."},{"q":"Чему следует закон в спорах Бейт Гиллель и Бейт Шаммай?","opts":["Как правило, мнению Бейт Гиллель","Как правило, мнению Бейт Шаммай","Решению царя","Жребию"],"a":0,"why":"По рассказу в Эрувин 13б, голос с небес назвал оба мнения словами Б-га живого, а закон установил по Бейт Гиллель. Мнения Шаммая при этом сохранены."},{"q":"Что такое хаврута?","opts":["Сборник законов о субботе","Голос с небес","Пара, которая учит текст вместе","Поле страницы Талмуда"],"a":2,"why":"Хаврута — учёба вдвоём: партнёры читают, спорят и задают друг другу вопросы."}],"cards":[{"id":"w5c1","he":"תורה שבעל פה","term":"Тора ше-бе-аль пе","def":"Устная Тора. По традиции объяснение к письменной Торе, данное у Синая и передававшееся из уст в уста."},{"id":"w5c2","he":"תנאים","term":"Таннаи","def":"«Учителя». Мудрецы, чьи слова записаны в Мишне. Их эпоха закончилась в начале III века н. э."},{"id":"w5c3","he":"אמוראים","term":"Амораи","def":"Мудрецы после таннаев, примерно 200–500 г. н. э., обсуждавшие Мишну в Стране Израиля и Вавилонии."},{"id":"w5c4","he":"משנה","term":"Мишна","def":"Свод устного учения, завершённый рабби Йегудой ха-Наси около 200 г. н. э. Шесть разделов, 63 трактата в принятом сейчас счёте."},{"id":"w5c5","he":"סדר","term":"Седер (мн. седарим)","def":"Раздел Мишны. Их шесть: Зраим, Моэд, Нашим, Незикин, Кодашим, Тохорот."},{"id":"w5c6","he":"מסכת","term":"Масехет (мн. масехтот)","def":"Трактат, часть раздела Мишны и Талмуда. Например, Бава Кама или Эрувин."},{"id":"w5c7","he":"גמרא","term":"Гемара","def":"Обсуждение Мишны амораями, в основном на арамейском. Вместе с Мишной составляет Талмуд."},{"id":"w5c8","he":"תלמוד בבלי","term":"Талмуд Бавли","def":"Вавилонский Талмуд, в основном завершён около 500 г. н. э. Главный и самый изучаемый из двух Талмудов."},{"id":"w5c9","he":"דף","term":"Даф","def":"Лист Талмуда. У него две стороны, а и б: «83б» значит «лист 83, вторая сторона»."},{"id":"w5c10","he":"תוספות","term":"Тосафот","def":"«Дополнения». Аналитические заметки учёных начиная с XII века на внешнем поле страницы Талмуда."},{"id":"w5c11","he":"מחלוקת","term":"Махлокет","def":"Спор, разногласие мудрецов. Спор «ради Небес» ведут ради истины (Пиркей Авот 5:17)."},{"id":"w5c12","he":"חברותא","term":"Хаврута","def":"По-арамейски «товарищество». Учёба в паре, где партнёры читают, спорят и задают друг другу вопросы."}],"sources":[{"title":"Encyclopaedia Britannica: Mishna","url":"https://www.britannica.com/topic/Mishna"},{"title":"Encyclopaedia Britannica: amora","url":"https://www.britannica.com/topic/amora"},{"title":"Jewish Virtual Library: Mishnah","url":"https://www.jewishvirtuallibrary.org/mishnah"},{"title":"Mishnah.org: Eduyot 1:5","url":"https://www.mishnah.org/learn/eduyos/1/5"},{"title":"My Jewish Learning: Hillel","url":"https://www.myjewishlearning.com/article/hillel/"},{"title":"Jewish Virtual Library: Hillel and Shammai","url":"https://www.jewishvirtuallibrary.org/hillel-and-shammai"},{"title":"Encyclopedia.com: Gemarah","url":"https://www.encyclopedia.com/religion/encyclopedias-almanacs-transcripts-and-maps/gemarah"},{"title":"Hadran: The Layout of a Talmud Page","url":"https://hadran.org.il/terms/the-layout-of-a-talmud-page/"},{"title":"Steinsaltz Center: History of the Daf Yomi","url":"https://steinsaltz.org/daf-history/"},{"title":"Tablet: Is An Eye for an Eye Really an Eye for an Eye?","url":"https://www.tabletmag.com/sections/belief/articles/daf-yomi-176"}]},{"n":6,"letter":"ו","title":"Время и практика","he":"שבת","desc":"Шаббат, календарь, праздники, кашрут","lessons":[{"id":"w6l1","title":"Шаббат","steps":[{"he":"שבת","h":"Седьмой день","verse":{"he":"ויברך אלהים את יום השביעי ויקדש אתו","ru":"«И благословил Б-г седьмой день, и освятил его» (Быт. 2:3)"},"p":"По Торе, Б-г творил мир шесть дней, а в седьмой прекратил работу. В Десяти речениях заповедь начинается словом «захор», «помни» (Исх. 20:8), и там же названа причина: отдых Б-га после творения (Исх. 20:11). Во Второзаконии заповедь начинается словом «шамор», «храни» (Втор. 5:12), и добавлен другой смысл: дать покой рабам и животным, помня рабство в Египте."},{"h":"От заката до темноты","p":"Шаббат длится от заката в пятницу до наступления темноты в субботу вечером. В традиционной практике перед закатом зажигают свечи. За ужином произносят кидуш, благословение над вином, которое освящает день, и благословляют две халы. По объяснению традиции, это память о двойной порции манны накануне субботы (Исх. 16:22). Завершает Шаббат обряд авдала, «разделение»."},{"he":"מלאכה","h":"39 видов работы","p":"Тора запрещает в Шаббат работу, а подробный перечень дают мудрецы. Мишна (Шаббат 7:2) называет 39 категорий, мелахот: пахать, печь, ткать, писать, строить, зажигать и гасить огонь, переносить вещи между владениями. Талмуд связывает их с работами при постройке Мишкана, святилища в пустыне. Ортодоксальные общины держатся этих запретов. Консервативное движение в 1950 году разрешило ездить в синагогу тем, кому иначе не добраться, и это решение до сих пор обсуждают. Реформистский иудаизм оставляет формы соблюдения на выбор человека."}],"check":{"q":"Сколько основных категорий запрещённой в Шаббат работы называет Мишна?","opts":["Десять","39","248","613"],"a":1,"why":"Мишна Шаббат 7:2 перечисляет 39 мелахот. Талмуд связывает их с работами при постройке Мишкана."}},{"id":"w6l2","title":"Календарь","steps":[{"he":"לוח השנה","h":"Луна и солнце","p":"Еврейский календарь лунно-солнечный. Месяц идёт за луной и длится 29 или 30 дней, а год подстраивается под солнце, чтобы праздники оставались в своих сезонах. По традиции сутки начинаются с вечера: мудрецы связывают это с порядком слов в рассказе о творении «и был вечер, и было утро, день один» (Быт. 1:5). Поэтому Шаббат и любой праздник начинаются накануне вечером."},{"he":"ראש חודש","h":"Рош Ходеш","p":"Каждый месяц начинается с новолуния. Этот день называют Рош Ходеш, «голова месяца». В эпоху Храма в этот день приносили особую жертву, о ней говорит Тора (Числ. 28:11–15). Если в предыдущем месяце было 30 дней, Рош Ходеш длится два дня: тридцатое число и первое число нового месяца."},{"h":"Високосный год и счёт лет","p":"Двенадцать лунных месяцев примерно на 11 дней короче солнечного года. Поэтому в 7 годах из каждых 19 добавляют тринадцатый месяц, и в году два адара: адар I и адар II. Постоянный расчётный календарь традиция связывает с Гиллелем II (IV век н. э.). Годы считают от сотворения мира, по традиционной хронологии это 3761 год до н. э. С Рош ха-Шана в сентябре 2026 года идёт 5787 год, а 5788 начнётся осенью 2027-го."}],"check":{"q":"Сколько раз за 19 лет в календарь добавляют тринадцатый месяц?","opts":["Один","Три","Пять","Семь"],"a":3,"why":"В 7 годах из 19 добавляют месяц, и в таком году два адара. Так лунные месяцы не отстают от солнечного года."}},{"id":"w6l3","title":"Праздники","steps":[{"he":"תשרי","h":"Осень: месяц тишрей","p":"Рош ха-Шана, 1 тишрея, — Новый год и день суда. В синагоге трубят в шофар, рог. Рош ха-Шана открывает десять дней покаяния. Их завершает Йом-Кипур, 10 тишрея, самый святой день года, день поста и молитвы. С 15 тишрея семь дней длится Суккот: едят в шалаше, сукке. Тора объясняет, что после исхода из Египта израильтяне жили в шалашах (Лев. 23:43). Затем Симхат Тора, «радость Торы»: годовой цикл чтения Торы заканчивают и начинают заново."},{"he":"שלוש רגלים","h":"Песах, Шавуот и паломничество","p":"Песах начинается 15 нисана и вспоминает исход из Египта: едят мацу, а праздник открывает седер, ритуальная трапеза. Через семь недель, 6 сивана, наступает Шавуот (в диаспоре ещё и 7 сивана), праздник жатвы пшеницы, который традиция связывает с дарованием Торы. Вместе с Суккот это три паломнических праздника, шалош регалим (Втор. 16:16). В Израиле Песах длится семь дней, в диаспоре восемь: в древности весть о новом месяце доходила до дальних общин не сразу, и там праздничный день стали удваивать."},{"h":"Ханука, Пурим, Тиша бе-Ав","p":"Ханука начинается 25 кислева и длится восемь дней. Она вспоминает новое освящение Второго Храма Маккавеями во II веке до н. э.; по принятому обычаю, каждый вечер зажигают на один огонь больше. Пурим, 14 адара, празднует спасение евреев Персии от замысла Амана, о котором рассказывает Книга Эстер. Тиша бе-Ав, 9 ава, — день траура и поста в память о разрушении Первого и Второго Храмов."}],"check":{"q":"Какие праздники называют тремя паломническими?","opts":["Рош ха-Шана, Йом-Кипур, Суккот","Ханука, Пурим, Песах","Песах, Шавуот, Суккот","Шавуот, Ханука, Тиша бе-Ав"],"a":2,"why":"Втор. 16:16 называет три праздника, когда в эпоху Храма приходили в Иерусалим: Песах, Шавуот и Суккот."}},{"id":"w6l4","title":"Кашрут","steps":[{"he":"כשרות","h":"Признаки животных","p":"Кашрут — правила о том, что можно есть. По Торе (Лев. 11:3, Втор. 14:6) из млекопитающих разрешены те, у кого раздвоенные копыта и кто жуёт жвачку; нужны оба признака. Свинья с раздвоенными копытами, но без жвачки запрещена. Из водных животных можно есть лишь тех, у кого есть плавники и чешуя (Лев. 11:9), поэтому креветки и моллюски некошерны. Из птиц разрешены только некоторые виды. Течения по-разному смотрят на то, насколько строго соблюдать кашрут."},{"he":"שחיטה","h":"Кровь и шхита","p":"Тора запрещает есть кровь, потому что «кровь — это жизнь» (Втор. 12:23; также Лев. 17:14). В традиционной практике разрешённое животное забивает обученный резник, шохет. Способ называется шхита: очень острый гладкий нож и быстрый разрез без остановки. Затем мясо вымачивают и солят, чтобы удалить остатки крови. Если шхита проведена не по правилам, мясо считается некошерным."},{"h":"Мясное и молочное","verse":{"he":"לא תבשל גדי בחלב אמו","ru":"«Не вари козлёнка в молоке его матери» (Исх. 23:19)"},"p":"Запрет варить козлёнка в молоке его матери повторён в Торе трижды: Исх. 23:19, Исх. 34:26 и Втор. 14:21. Раввинская традиция расширила его до разделения: мясное и молочное не едят вместе и держат для них отдельную посуду, а нейтральная еда, парве, подходит к обоим. После мяса до молочного ждут, в разных общинах от одного часа до шести. Пригодность продукта подтверждает раввинский надзор, его знак на упаковке называют хехшер."}],"check":{"q":"Какие обитатели воды разрешены по Торе?","opts":["Все рыбы без исключения","Те, у кого есть плавники и чешуя","Только морские, но не речные","Любые, если их поймали сетью"],"a":1,"why":"Лев. 11:9 и Втор. 14:9: разрешены те, у кого есть плавники и чешуя. Поэтому креветки и моллюски некошерны."}}],"quiz":[{"q":"Когда заканчивается Шаббат?","opts":["В полночь с субботы на воскресенье","На рассвете в субботу","Когда в субботу вечером наступает темнота","В полдень субботы"],"a":2,"why":"Шаббат длится от заката в пятницу до наступления темноты в субботу вечером."},{"q":"Как традиция объясняет две халы на субботнем столе?","opts":["Одну полагается отдать гостю","Это память о двойной порции манны накануне субботы","Их число равно числу свечей","Шаббат длится два дня"],"a":1,"why":"По Исх. 16:22 в шестой день в пустыне собирали манну вдвойне, чтобы не собирать её в субботу."},{"q":"Какой год по еврейскому счёту начался в Рош ха-Шана в сентябре 2026 года?","opts":["5785","5786","5788","5787"],"a":3,"why":"Номер года сменяется в Рош ха-Шана, поэтому 5788 начнётся осенью 2027-го."},{"q":"Когда, по традиции, начинаются сутки в еврейском календаре?","opts":["Вечером","В полночь","На рассвете","В полдень"],"a":0,"why":"По традиции сутки начинаются с вечера; мудрецы связывают это с порядком слов «и был вечер, и было утро, день один» (Быт. 1:5). Поэтому Шаббат и праздники начинаются накануне вечером."},{"q":"Что вспоминают в Тиша бе-Ав?","opts":["Дарование Торы","Разрушение Первого и Второго Храмов","Исход из Египта","Спасение евреев Персии"],"a":1,"why":"9 ава — день траура и поста по обоим разрушенным Храмам. Исход вспоминают в Песах, спасение евреев Персии в Пурим."},{"q":"Какой праздник приходится на 10 тишрея?","opts":["Рош ха-Шана","Суккот","Йом-Кипур","Симхат Тора"],"a":2,"why":"Йом-Кипур, День искупления, завершает десять дней покаяния, которые открывает Рош ха-Шана 1 тишрея."},{"q":"Где в Торе стоит запрет варить козлёнка в молоке его матери?","opts":["Быт. 2:3, Исх. 20:8, Лев. 11:3","Лев. 11:9, Лев. 17:14, Втор. 12:23","Исх. 16:22, Исх. 20:11, Втор. 5:12","Исх. 23:19, Исх. 34:26, Втор. 14:21"],"a":3,"why":"Запрет повторён трижды. Опираясь на него, раввинская традиция расширила запрет до разделения мясного и молочного."},{"q":"Почему свинья некошерна по Торе?","opts":["У неё раздвоенные копыта, но она не жуёт жвачку","У неё совсем нет копыт","Она живёт рядом с водой","Она жуёт жвачку, но копыта у неё не раздвоены"],"a":0,"why":"Нужны оба признака: раздвоенные копыта и жвачка (Лев. 11:3). У свиньи есть только первый."}],"cards":[{"id":"w6c1","he":"שבת","term":"Шаббат","def":"Седьмой день недели, день покоя. Длится от заката в пятницу до наступления темноты в субботу вечером."},{"id":"w6c2","he":"מלאכה","term":"Мелаха","def":"Вид работы, запр
