ещённой в Шаббат. Мишна (Шаббат 7:2) называет 39 основных категорий, мелахот."},{"id":"w6c3","he":"קידוש","term":"Кидуш","def":"«Освящение». Благословение над вином, которое освящает Шаббат или праздник."},{"id":"w6c4","he":"חלה","term":"Хала","def":"Субботний хлеб. По обычаю на стол кладут две халы в память о двойной порции манны накануне субботы."},{"id":"w6c5","he":"הבדלה","term":"Авдала","def":"«Разделение». Обряд в субботу вечером, отделяющий Шаббат от будней."},{"id":"w6c6","he":"ראש חודש","term":"Рош Ходеш","def":"«Голова месяца». Начало месяца по новолунию."},{"id":"w6c7","he":"יום כיפור","term":"Йом-Кипур","def":"День искупления, 10 тишрея. Самый святой день года, день поста и молитвы."},{"id":"w6c8","he":"סוכה","term":"Сукка","def":"Шалаш, в котором едят в праздник Суккот. Тора связывает его с жизнью израильтян в шалашах после исхода из Египта (Лев. 23:43)."},{"id":"w6c9","he":"שלוש רגלים","term":"Шалош регалим","def":"Три паломнических праздника: Песах, Шавуот и Суккот. В эпоху Храма в эти дни приходили в Иерусалим."},{"id":"w6c10","he":"כשרות","term":"Кашрут","def":"Правила о том, какую пищу можно есть и как её готовить. Основа в Лев. 11 и Втор. 14."},{"id":"w6c11","he":"שחיטה","term":"Шхита","def":"Забой разрешённого животного обученным резником, шохетом: очень острый гладкий нож, быстрый разрез без остановки."},{"id":"w6c12","he":"הכשר","term":"Хехшер","def":"Свидетельство раввинского надзора о том, что продукт кошерный. Обычно печатается знаком на упаковке."}],"sources":[{"title":"Encyclopaedia Britannica: Sabbath","url":"https://www.britannica.com/topic/Sabbath-Judaism"},{"title":"My Jewish Learning: Shabbat in the Bible","url":"https://www.myjewishlearning.com/article/shabbat-in-the-bible/"},{"title":"Chabad.org: The 39 Melachot","url":"https://www.chabad.org/library/article_cdo/aid/102032/jewish/The-39-Melachot.htm"},{"title":"Chabad.org: The Jewish Calendar","url":"https://www.chabad.org/library/article_cdo/aid/526875/jewish/The-Jewish-Calendar.htm"},{"title":"Jewish Virtual Library: The Jewish Calendar","url":"https://www.jewishvirtuallibrary.org/the-jewish-calendar"},{"title":"Hebcal: Pesach","url":"https://www.hebcal.com/holidays/pesach"},{"title":"Hebcal: Sukkot","url":"https://www.hebcal.com/holidays/sukkot"},{"title":"My Jewish Learning: Why Does Rosh Hashanah Last for Two Days?","url":"https://www.myjewishlearning.com/article/why-does-rosh-hashanah-last-for-two-days/"},{"title":"Encyclopaedia Britannica: Kashruth","url":"https://www.britannica.com/topic/kashruth"},{"title":"My Jewish Learning: Waiting Between Eating Meat and Dairy","url":"https://www.myjewishlearning.com/article/waiting-between-eating-meat-and-dairy/"}]},{"n":7,"letter":"ז","title":"Диаспора","he":"גלות","desc":"Маймонид, Испания, Каббала, хасидизм и Просвещение","lessons":[{"id":"w7l1","title":"Маймонид","steps":[{"he":"רמב״ם","h":"Врач, законоучитель, философ","p":"Моше бен Маймон (Моисей Маймонид), коротко Рамбам, родился в Кордове, в мусульманской Испании. Год рождения источники дают по-разному: 1135 или 1138. Около 1148 года власть захватили Альмохады и потребовали от иноверцев принять ислам. Семья Рамбама уехала, жила в Фесе, а затем он поселился в Египте. Там он умер в 1204 году. По преданию, его похоронили в Тверии."},{"he":"משנה תורה","h":"Две главные книги","p":"Мишне Тора — свод всего еврейского закона в 14 книгах, написанный на ясном иврите. Работа заняла около десяти лет и была завершена около 1180 года. «Путеводитель растерянных» («Море невухим») написан по-арабски и закончен около 1190 года. В нём Рамбам стремится совместить Тору и философию."},{"h":"13 принципов и наследие","p":"В комментарии к Мишне Рамбам свёл основы веры в 13 принципов. На их основе сложены гимн «Игдаль» и молитва «Ани маамин» («Я верую»). В Египте он был придворным врачом: лечил визиря султана Саладина и семью самого султана. Его книги не все приняли сразу: в 1232 году часть раввинов во Франции запретила читать его философские сочинения. Позже сложилась поговорка: «От Моше до Моше не было подобного Моше»."}],"check":{"q":"На каком языке написан «Путеводитель растерянных»?","opts":["На иврите","На арабском","На арамейском","На латыни"],"a":1,"why":"Путеводитель написан по-арабски. А Мишне Тору Рамбам написал на иврите."}},{"id":"w7l2","title":"Сфарад и Ашкеназ","steps":[{"he":"ספרד","h":"Золотой век Испании","p":"Сфарад на иврите значит «Испания». В XI–XII веках в Испании, прежде всего мусульманской, расцвела поэзия на иврите. Шмуэль ха-Нагид был визирем Гранады и командовал её армией. Шломо ибн Гвироль написал «Кетер малхут» («Царский венец»), его читают в некоторых общинах на Йом-Кипур. Йегуда Галеви писал стихи о Сионе и книгу «Кузари»."},{"he":"אשכנז","h":"Раши и Рейн","p":"Ашкеназ в средневековых текстах значит «Германия». Еврейская учёность выросла в городах на Рейне: Майнце и Вормсе. Там учился Шломо Ицхаки (Раши, 1040–1105) из Труа во Франции. Его комментарии к Танаху и Талмуду изучают до сих пор. В 1096 году участники Первого крестового похода разгромили общины Шпайера, Вормса и Майнца. Многие предпочли смерть крещению: это называют «кидуш ха-Шем», освящение Имени."},{"h":"Две традиции и два языка","p":"31 марта 1492 года Фердинанд и Изабелла приказали евреям Испании креститься или уехать до конца июля. Оценки числа изгнанных сильно расходятся. Многие ушли в Португалию (там в 1497 году евреев изгнали или насильно крестили), в Северную Африку и Османскую империю. Сефарды и ашкеназы различаются обычаями, а не верой. Ашкеназы говорили на идише (основа германская), сефарды на ладино (основа испанская). Оба языка традиционно пишутся еврейскими буквами."}],"check":{"q":"Что значит слово «Ашкеназ» в средневековых еврейских текстах?","opts":["Испания","Франция","Германия","Польша"],"a":2,"why":"Ашкеназ — Германия, отсюда «ашкеназы». Сфарад — Испания, отсюда «сефарды»."}},{"id":"w7l3","title":"Каббала","steps":[{"he":"קבלה","h":"Принятое предание","p":"Каббала значит «получение», то есть полученная традиция. Так называют еврейскую мистику. Б-г, как Он есть сам по себе, называется Эйн Соф, «Бесконечный»: Он непостижим. От Него исходят десять сфирот, ступеней или сил, через которые Б-г проявляется в мире."},{"he":"זוהר","h":"Книга Зоар","p":"Главная книга Каббалы — Зоар, в основном мистический комментарий к Торе на арамейском. По традиции, это учение рабби Шимона бар Йохая, мудреца II века, и его учеников. По мнению историков, книга создана в Испании в конце XIII века, скорее всего каббалистом Моше де Леоном (часть учёных видит автором круг мистиков)."},{"he":"צפת","h":"Цфат XVI века","p":"В XVI веке Цфат в Галилее стал центром Каббалы. Около 1570 года туда прибыл Ицхак Лурия (1534–1572), Ари. Сам он писал мало, его учение записал ученик Хаим Виталь. По Лурии, свет Б-га не удержался в «сосудах», они разбились, и искры света рассеялись. Тикун, «исправление», возвращает их к источнику, и человек участвует в нём молитвой. В Цфате жил и Йосеф Каро, автор Шулхан Аруха."}],"check":{"q":"Кому традиция приписывает книгу Зоар?","opts":["Моше де Леону","Рамбаму","Ицхаку Лурии","Рабби Шимону бар Йохаю"],"a":3,"why":"По традиции, Зоар передаёт учение Шимона бар Йохая. Многие историки считают автором Моше де Леона, жившего в Испании в конце XIII века."}},{"id":"w7l4","title":"Хасидизм и Просвещение","steps":[{"he":"בעל שם טוב","h":"Бааль Шем Тов","p":"Исраэль бен Элиэзер (около 1700–1760), известный как Бааль Шем Тов, жил на Подолье и умер в Меджибоже. Он основал хасидизм. Бешт (так его называют сокращённо) учил, что Б-гу служат в радости, что главное — молитва с воодушевлением и двекут, близость к Б-гу. Святость можно найти и в обычной жизни."},{"he":"מתנגדים","h":"Хасиды и митнагдим","p":"Знатоки Талмуда встретили новое движение с тревогой. Их назвали митнагдим, «противники». Их главным вдохновителем стал Элиягу бен Шломо, Виленский Гаон (1720–1797) из Литвы. Митнагдим ставили в центр изучение Талмуда."},{"he":"השכלה","h":"Хаскала и эмансипация","p":"Хаскала, еврейское Просвещение, от слова «сехель», «разум». Её отцом считают Моше Мендельсона (Моисея Мендельсона, 1729–1786) из Дессау, жившего в Берлине. Он перевёл Тору на немецкий. Сторонники Хаскалы, маскилим, добавляли к учёбе светские науки и европейские языки. Эмансипация — уравнение евреев в правах с другими гражданами. Во Франции закон 1791 года дал равные права всем евреям страны. О течениях XIX века речь пойдёт на неделе 8."}],"check":{"q":"Что значит слово «митнагдим»?","opts":["«Противники»","«Благочестивые»","«Просвещённые»","«Ученики»"],"a":0,"why":"Митнагдим — «противники» хасидизма. «Благочестивые» ближе к слову «хасидим», а «просвещённые» — маскилим."}}],"quiz":[{"q":"Что такое Мишне Тора?","opts":["Философская книга на арабском","Свод еврейского закона в 14 книгах","Комментарий к Зоару","Сборник стихов о Сионе"],"a":1,"why":"Мишне Тора — кодекс Рамбама на иврите, завершён около 1180 года. Философская книга на арабском — это «Путеводитель растерянных»."},{"q":"Где Рамбам прожил последние десятилетия жизни и работал врачом?","opts":["В Кордове","В Цфате","В Труа","В Египте"],"a":3,"why":"Рамбам поселился в Египте и был придворным врачом. Кордова — его родной город, где он родился в 1135 или 1138 году."},{"q":"Какой поэт золотого века был визирем Гранады и командовал её армией?","opts":["Шмуэль ха-Нагид","Йегуда Галеви","Шломо ибн Гвироль","Раши"],"a":0,"why":"Шмуэль ха-Нагид совмещал власть и поэзию. Ибн Гвироль и Галеви были поэтами, а Раши был комментатором из Франции."},{"q":"Чем ладино отличается от идиша?","opts":["Ладино возник в Польше, а идиш в Испании","На ладино говорили ашкеназы, на идише сефарды","Ладино имеет испанскую основу, идиш германскую","Ладино — древний язык Торы"],"a":2,"why":"Ладино — язык сефардов на испанской основе, идиш — язык ашкеназов на германской. Оба традиционно пишутся еврейскими буквами."},{"q":"Что означает Эйн Соф в Каббале?","opts":["Десять ступеней проявления Б-га","Б-г как Он есть сам по себе, «Бесконечный»","Разбитые сосуды","Город мистиков в Галилее"],"a":1,"why":"Эйн Соф — «Бесконечный», непостижимый Б-г. Десять ступеней — это сфирот, разбитые сосуды — образ из учения Лурии."},{"q":"Что по учению Лурии означает тикун?","opts":["Изгнание из Испании","Запрет изучать философию","Перевод Торы на немецкий","Исправление: возвращение рассеянных искр к источнику"],"a":3,"why":"Тикун — «исправление». Человек участвует в нём молитвой."},{"q":"Что Бааль Шем Тов ставил в центр служения Б-гу?","opts":["Строгий пост и печаль","Только изучение философии","Радость и молитву с воодушевлением","Отказ от обычной жизни"],"a":2,"why":"Бешт учил служить Б-гу в радости и видел главное в молитве и близости к Б-гу, двекут."},{"q":"Кого называют отцом Хаскалы, еврейского Просвещения?","opts":["Моше Мендельсона","Виленского Гаона","Бааль Шем Това","Йосефа Каро"],"a":0,"why":"Моше Мендельсон (1729–1786) жил в Берлине и перевёл Тору на немецкий. Виленский Гаон возглавлял противников хасидизма."}],"cards":[{"id":"w7c1","he":"גלות","term":"Галут","def":"Изгнание. Положение народа, оторванного от родины и живущего под чужой властью. Так прежде всего называют период еврейской истории от разрушения Второго Храма до создания Государства Израиль."},{"id":"w7c2","he":"רמב״ם","term":"Рамбам","def":"Рабби Моше бен Маймон, Маймонид (1135 или 1138 – 1204). Автор Мишне Торы и «Путеводителя растерянных»."},{"id":"w7c3","he":"משנה תורה","term":"Мишне Тора","def":"Свод еврейского закона Рамбама в 14 книгах на иврите, завершён около 1180 года."},{"id":"w7c4","he":"מורה נבוכים","term":"Море невухим","def":"«Путеводитель растерянных». Философская книга Рамбама на арабском, закончена около 1190 года."},{"id":"w7c5","he":"ספרדים","term":"Сефарды","def":"Евреи, чьи предки жили в Испании (Сфарад) и Португалии. Традиционный язык — ладино."},{"id":"w7c6","he":"אשכנזים","term":"Ашкеназы","def":"Евреи, чья традиция восходит к общинам Германии (Ашкеназ) и Рейна. Традиционный язык — идиш."},{"id":"w7c7","he":"קידוש השם","term":"Кидуш ха-Шем","def":"«Освящение Имени». Готовность умереть, но не отречься от веры, как в Рейнской области в 1096 году."},{"id":"w7c8","he":"קבלה","term":"Каббала","def":"«Получение», принятое предание. Еврейская мистическая традиция."},{"id":"w7c9","he":"ספירות","term":"Сфирот","def":"Десять ступеней или сил, исходящих от Эйн Соф, через которые, по Каббале, Б-г проявляется в мире."},{"id":"w7c10","he":"תיקון","term":"Тикун","def":"«Исправление». У Лурии: возвращение рассеянных искр Б-жественного света к источнику."},{"id":"w7c11","he":"שולחן ערוך","term":"Шулхан Арух","def":"«Накрытый стол». Кодекс галахи Йосефа Каро из Цфата, XVI век; издан в Венеции в 1560-е годы."},{"id":"w7c12","he":"השכלה","term":"Хаскала","def":"Еврейское Просвещение XVIII–XIX веков, от слова «сехель», «разум». Её отцом считают Моше Мендельсона."}],"sources":[{"title":"Jewish Virtual Library: Moses Maimonides (Rambam)","url":"https://www.jewishvirtuallibrary.org/moses-maimonides-rambam"},{"title":"Stanford Encyclopedia of Philosophy: Maimonides","url":"https://plato.stanford.edu/entries/maimonides/"},{"title":"Encyclopaedia Judaica (encyclopedia.com): Samuel ha-Nagid","url":"https://www.encyclopedia.com/religion/dictionaries-thesauruses-pictures-and-press-releases/samuel-ha-nagid"},{"title":"Jewish Virtual Library: Rashi","url":"https://www.jewishvirtuallibrary.org/rashi"},{"title":"Jewish Virtual Library: The Crusades","url":"https://www.jewishvirtuallibrary.org/the-crusades"},{"title":"Jewish Virtual Library: Sephardim","url":"https://www.jewishvirtuallibrary.org/sephardim"},{"title":"Jewish Virtual Library: Zohar","url":"https://www.jewishvirtuallibrary.org/zohar"},{"title":"Encyclopaedia Britannica: Isaac ben Solomon Luria","url":"https://www.britannica.com/print/article/351761"},{"title":"My Jewish Learning: The Baal Shem Tov","url":"https://www.myjewishlearning.com/article/the-baal-shem-tov/"},{"title":"Jewish Virtual Library: Moses Mendelssohn","url":"https://www.jewishvirtuallibrary.org/moses-mendelssohn"}]},{"n":8,"letter":"ח","title":"Современность","he":"ימינו","desc":"Течения, Холокост, Израиль и еврейская жизнь сегодня","lessons":[{"id":"w8l1","title":"Течения сегодня","steps":[{"he":"זרמים","h":"Откуда взялись течения","p":"В XIX веке в Германии часть раввинов стала менять богослужение, чтобы приблизить его к современной жизни. Одним из основателей реформистского иудаизма был раввин Авраам Гейгер: в службе появились молитвы на местном языке и проповедь по-немецки. В 1845 году раввин Захария Франкель покинул съезд реформистов, когда там решили, что иврит в молитве необязателен. В 1854 году он возглавил раввинскую семинарию в Бреслау."},{"h":"Ортодоксы и масорти","p":"Ортодоксальный иудаизм считает галаху обязательной в полном объёме; мужчины и женщины в синагоге сидят раздельно. Современные ортодоксы соединяют соблюдение заповедей со светским образованием. Харедим, ультраортодоксы, соблюдают строже всех и держатся обособленно от светского общества. Консервативное течение, вне Северной Америки называемое масорти, выросло из идей Франкеля: оно тоже считает галаху обязательной, но допускает её развитие."},{"h":"Реформисты, реконструкционисты, светские","p":"Реформистский, или либеральный, иудаизм ставит на первое место этику и оставляет обряды на выбор человека. Первую женщину-раввина в США рукоположили реформисты в 1972 году, консерваторы в 1985. Происхождение по отцу реформисты признали в 1983 году, реконструкционисты ещё раньше. Реконструкционизм основал в США раввин Мордехай Каплан: он видел в иудаизме развивающуюся цивилизацию. Многие евреи светские: в Израиле, по опросам Pew (2014–2015) и Центрального статистического бюро (2022), светскими, «хилоним», себя называют 45–49% евреев."}],"check":{"q":"Из-за чего Захария Франкель в 1845 году покинул съезд реформистов?","opts":["Съезд решил, что иврит в молитве необязателен","Съезд отменил празднование Шаббата","Съезд запретил изучать Талмуд","Съезд перенёс богослужение на воскресенье"],"a":0,"why":"Франкель настаивал на иврите как языке молитвы. Из его идей позже выросло консервативное течение (масорти)."}},{"id":"w8l2","title":"Катастрофа (Шоа)","steps":[{"he":"שואה","h":"Что такое Холокост","p":"Холокост (на иврите Шоа) — это систематическое, организованное государством преследование и убийство евреев Европы нацистской Германией, её союзниками и пособниками в 1933–1945 годах. Погибли около шести миллионов евреев. По данным Яд ва-Шем, точного числа нет, и серьёзные исследования дают от пяти до шести миллионов. Это были мужчины, женщины и дети, целые общины с их языком, учёностью и укладом жизни."},{"h":"Шаг за шагом","p":"15 сентября 1935 года нацисты приняли Нюрнбергские законы: евреи лишились полного гражданства. В ночь на 10 ноября 1938 года прошла Хрустальная ночь: погром по всей Германии (включая присоединённую Австрию), были сожжены или разрушены более тысячи синагог. 20 января 1942 года на Ванзейской конференции чиновники согласовали осуществление «окончательного решения», плана уничтожения евреев Европы. Людей убивали в гетто, в ходе массовых расстрелов и в лагерях, в том числе в лагерях уничтожения: Освенцим (Аушвиц-Биркенау), Треблинка, Собибор, Белжец, Хелмно."},{"he":"זיכרון","h":"Сопротивление и память","p":"19 апреля 1943 года, в канун Песаха, началось восстание в Варшавском гетто: евреи сопротивлялись почти месяц. Мемориал Яд ва-Шем присваивает звание Праведника народов мира неевреям, которые с риском для жизни спасали евреев; их уже многие тысячи. В Израиле день памяти, Йом ха-Шоа, отмечают 27 нисана (если дата примыкает к Шаббату, её сдвигают на день); в этот день звучит сирена. По решению ООН 2005 года Международный день памяти жертв Холокоста отмечают 27 января, в годовщину освобождения Освенцима."}],"check":{"q":"Почему Международный день памяти жертв Холокоста отмечают 27 января?","opts":["В этот день была Хрустальная ночь","В этот день приняли Нюрнбергские законы","В этот день в 1945 году был освобождён Освенцим","В этот день началось восстание в Варшавском гетто"],"a":2,"why":"27 января 1945 года советские войска освободили узников Освенцима. В Израиле есть и свой день памяти, Йом ха-Шоа, 27 нисана (рядом с Шаббатом дату сдвигают)."}},{"id":"w8l3","title":"Израиль и сионизм","steps":[{"he":"ציונות","h":"Сионизм и Герцль","p":"Сионизм — движение конца XIX века. Его целью был дом для еврейского народа на земле Израиля (Эрец-Исраэль). В 1896 году Теодор Герцль издал книгу «Еврейское государство». В августе 1897 года он созвал в швейцарском Базеле Первый сионистский конгресс; конгресс принял Базельскую программу, а Герцля избрали президентом Сионистской организации."},{"h":"От декларации до государства","p":"2 ноября 1917 года министр иностранных дел Британии Артур Бальфур написал лорду Ротшильду, что правительство поддерживает создание в Палестине «национального очага для еврейского народа», не ущемляя гражданских и религиозных прав нееврейских общин. 29 ноября 1947 года Генеральная Ассамблея ООН приняла план раздела: арабское и еврейское государства и международный статус Иерусалима. 14 мая 1948 года Давид Бен-Гурион провозгласил в Тель-Авиве создание Государства Израиль."},{"he":"חוק השבות","h":"Закон, язык и общины","p":"5 июля 1950 года Кнессет принял Закон о возвращении: «Каждый еврей имеет право приехать в эту страну как оле» (репатриант). В 1970 году право распространили на детей и внуков евреев и на супругов. Иврит снова стал разговорным языком; большую роль в этом сыграл Элиэзер Бен-Йегуда (1858–1922): его семья первой дома говорила только на иврите. Сегодня в мире почти 16 миллионов евреев (оценка Делла Пергола на начало 2024 года; методики разные): в Израиле больше 7 миллионов, в США около 6,3 миллиона."}],"check":{"q":"Где в 1897 году прошёл Первый сионистский конгресс?","opts":["В Вене","В Базеле","В Лондоне","В Иерусалиме"],"a":1,"why":"Герцль созвал конгресс в швейцарском Базеле, там была принята Базельская программа."}},{"id":"w8l4","title":"Жизненный цикл и общины","steps":[{"he":"בר מצווה","h":"Имя и совершеннолетие","p":"Мальчику делают брит-милу на восьмой день и тогда же дают еврейское имя; при проблемах со здоровьем обряд откладывают. Имя девочке традиционно объявляют в синагоге при чтении Торы, бывает и отдельный праздник в честь рождения дочери. Религиозное совершеннолетие: у мальчиков в 13 лет (бар-мицва), у девочек по традиции в 12 (бат-мицва), в части общин в 13. Первую известную бат-мицву в США Мордехай Каплан провёл для дочери Джудит в 1922 году. Порядок обряда в течениях различается."},{"he":"חופה","h":"Свадьба и траур","p":"Свадьбу проводят под хупой, балдахином, который символизирует будущий дом пары. Читают ктубу, брачный договор, и произносят семь благословений. В конце разбивают бокал: по одному объяснению, в память о разрушении Храма даже в минуту радости. После похорон близкие семь дней сидят шиву: остаются дома, их навещают. Дети читают по родителям кадиш, арамейскую молитву-прославление Б-га, одиннадцать месяцев; по традиции нужен миньян."},{"h":"Разные общины","p":"Ашкеназы ведут род от евреев Германии, позже расселившихся в Восточной Европе, сефарды от евреев Испании и Португалии, мизрахим («восточные») от общин Ближнего Востока и Северной Африки. Из СССР в 1970-е уехали около 250 тысяч евреев, многим отказывали («отказники»); с 1989 года в Израиль переехали около миллиона, многие также в США и Германию. Эфиопских евреев называют Бета Исраэль, «Дом Израиля»; в мае 1991 года в ходе операции «Соломон» в Израиль перевезли 14–15 тысяч из них."}],"check":{"q":"Сколько дней длится шива?","opts":["Три дня","Тридцать дней","Одиннадцать месяцев","Семь дней"],"a":3,"why":"Шива значит «семь»: семь дней траура после похорон. Одиннадцать месяцев дети умершего читают кадиш."}}],"quiz":[{"q":"Кого считают одним из основателей реформистского иудаизма в Германии XIX века?","opts":["Мордехая Каплана","Теодора Герцля","Авраама Гейгера","Элиэзера Бен-Йегуду"],"a":2,"why":"Раввин Авраам Гейгер был среди основателей реформистского течения. Каплан основал реконструкционизм в США."},{"q":"Какое течение признало происхождение по отцу ещё раньше реформистов?","opts":["Ортодоксальное","Реконструкционистское","Консервативное","Ни одно из течений"],"a":1,"why":"Реконструкционисты признали происхождение по отцу раньше реформистов, принявших это решение в 1983 году. Ортодоксы и консерваторы его не признают."},{"q":"Какое событие произошло 20 января 1942 года?","opts":["Ванзейская конференция","Хрустальная ночь","Принятие Нюрнбергских законов","Начало восстания в Варшавском гетто"],"a":0,"why":"На Ванзейской конференции чиновники согласовали осуществление «окончательного решения». Нюрнбергские законы приняли в 1935 году, Хрустальная ночь прошла в ноябре 1938-го, восстание в Варшавском гетто началось в апреле 1943-го."},{"q":"Кому Яд ва-Шем присваивает звание Праведника народов мира?","opts":["Узникам гетто, поднявшим восстание","Солдатам, освободившим лагеря","Историкам, изучающим Холокост","Неевреям, которые с риском для жизни спасали евреев"],"a":3,"why":"Это звание для неевреев, рисковавших жизнью ради спасения евреев. Таких людей уже многие тысячи."},{"q":"Что произошло 14 мая 1948 года?","opts":["Принят Закон о возвращении","Опубликована декларация Бальфура","Провозглашено Государство Израиль","ООН приняла план раздела"],"a":2,"why":"В этот день Давид Бен-Гурион провозгласил в Тель-Авиве создание Израиля. План раздела ООН приняли 29 ноября 1947 года."},{"q":"Чьё имя прежде всего связывают с возрождением иврита как разговорного языка?","opts":["Элиэзер Бен-Йегуда","Артур Бальфур","Захария Франкель","Давид Бен-Гурион"],"a":0,"why":"Элиэзер Бен-Йегуда (1858–1922) сыграл большую роль в возрождении иврита: его семья первой дома говорила только на иврите."},{"q":"Что традиционно делают в конце свадебной церемонии?","opts":["Зажигают семь свечей","Разбивают бокал","Читают кадиш","Трубят в шофар"],"a":1,"why":"Разбитый бокал, по одному из объяснений, напоминает о разрушении Храма даже в минуту радости."},{"q":"Как называют общины евреев Ближнего Востока и Северной Африки?","opts":["Ашкеназы","Бета Исраэль","Хилоним","Мизрахим"],"a":3,"why":"Мизрахим значит «восточные». Понятия «мизрахим» и «сефарды» частично пересекаются: многие мизрахим следуют сефардским обычаям."}],"cards":[{"id":"w8c1","he":"חרדים","term":"Харедим","def":"Ультраортодоксальные евреи. Соблюдают галаху строже всех и держатся обособленно от светского общества."},{"id":"w8c2","he":"מסורתי","term":"Масорти","def":"Название консервативного иудаизма вне Северной Америки. Считает галаху обязательной, но допускающей развитие."},{"id":"w8c3","he":"חילונים","term":"Хилоним","def":"Светские евреи в Израиле. По опросам 2014–2022 годов, так себя называют 45–49% израильских евреев."},{"id":"w8c4","he":"שואה","term":"Шоа","def":"Ивритское название Холокоста: убийства около шести миллионов евреев Европы нацистами и их пособниками в 1933–1945 годах."},{"id":"w8c5","he":"חסידי אומות העולם","term":"Хасидей умот ха-олам","def":"Праведники народов мира. Звание, которое Яд ва-Шем присваивает неевреям, спасавшим евреев с риском для жизни."},{"id":"w8c6","he":"יום השואה","term":"Йом ха-Шоа","def":"День памяти Катастрофы в Израиле, 27 нисана; если дата примыкает к Шаббату, её сдвигают на день. Закреплён решением Кнессета."},{"id":"w8c7","he":"ציונות","term":"Ционут","def":"Сионизм. Движение конца XIX века за национальный дом еврейского народа на земле Израиля. Первый конгресс прошёл в Базеле в 1897 году."},{"id":"w8c8","he":"חוק השבות","term":"Хок ха-швут","def":"Закон о возвращении (1950). Даёт каждому еврею право приехать в Израиль; с 1970 года также детям и внукам евреев."},{"id":"w8c9","he":"בר מצווה","term":"Бар-мицва","def":"«Сын заповеди». Религиозное совершеннолетие мальчика в 13 лет. У девочек бат-мицва, по традиции в 12 лет, в части общин в 13."},{"id":"w8c10","he":"חופה","term":"Хупа","def":"Свадебный балдахин, под которым проходит еврейская свадьба. Символ будущего дома пары."},{"id":"w8c11","he":"שבעה","term":"Шива","def":"«Семь». Семь дней траура после похорон близкого, когда скорбящие остаются дома и их навещают."},{"id":"w8c12","he":"קדיש","term":"Кадиш","def":"Арамейская молитва-прославление Б-га. Дети читают её по родителям одиннадцать месяцев; по традиции нужен миньян."}],"sources":[{"title":"USHMM Holocaust Encyclopedia: Introduction to the Holocaust","url":"https://encyclopedia.ushmm.org/content/en/article/introduction-to-the-holocaust"},{"title":"Yad Vashem: Holocaust FAQs","url":"https://www.yadvashem.org/holocaust/faqs.html"},{"title":"Encyclopaedia Judaica via Jewish Virtual Library: Conservative Judaism","url":"https://jewishvirtuallibrary.org/jsource/judaica/ejud_0002_0005_0_04582.html"},{"title":"My Jewish Learning: Jewish Denominations","url":"https://www.myjewishlearning.com/article/jewish-denominations/"},{"title":"Jewish Virtual Library: Abraham Geiger","url":"https://www.jewishvirtuallibrary.org/abraham-geiger"},{"title":"Jewish Virtual Library: First Zionist Congress and Basel Program","url":"https://www.jewishvirtuallibrary.org/first-zionist-congress-and-basel-program-1897"},{"title":"Encyclopaedia Britannica: Balfour Declaration","url":"https://www.britannica.com/event/Balfour-Declaration"},{"title":"U.S. Office of the Historian: Creation of Israel, 1948","url":"https://history.state.gov/milestones/1945-1952/creation-israel"},{"title":"Sergio DellaPergola: World Jewish Population, 2024","url":"https://www.cbs.gov.il/he/Documents/World%20DellaPergola%202024%20complete.pdf"},{"title":"Jewish Virtual Library: The First Bat Mitzvah in the United States","url":"https://www.jewishvirtuallibrary.org/jsource/Judaism/firstbat.html"}]}];
  const LEVELS = WEEKS;

  const CARDS = [];

    const seen = {};
    WEEKS.forEach((w) => {
      w.cards = w.cards.filter((c) => { if (seen[c.he]) return false; seen[c.he] = 1; return true; });
      w.lessons.forEach((l) => { l.week = w.n; LESSONS.push(l); });
      w.cards.forEach((c) => { c.week = w.n; CARDS.push(c); });
    });
  })();

  const BADGES = [
    { id: "first", he: "א", name: "Первый шаг", how: "Пройдите первый урок", test: (s) => Object.keys(s.lessons).length >= 1 },
    { id: "three", he: "ג", name: "Три дня подряд", how: "Занимайтесь три дня подряд", test: (s) => s.best >= 3 },
    { id: "vocab", he: "מ", name: "Словарь", how: "Отметьте «Знаю» на шести карточках", test: (s) => s.knows >= 6 },
    { id: "week1", he: "י", name: "Неделя пройдена", how: "Пройдите любую неделю целиком", test: () => WEEKS.some((w) => weekDone(w.n)) },
    { id: "perfect", he: "ת", name: "Безупречно", how: "Ответьте верно на все 8 вопросов любого квиза", test: (s) => Object.keys(s.quizzes).some((k) => s.quizzes[k].best === 8) },
    { id: "half", he: "ד", name: "Полпути", how: "Пройдите четыре недели", test: () => WEEKS.filter((w) => weekDone(w.n)).length >= 4 },
    { id: "words", he: "ס", name: "Большой словарь", how: "Отметьте «Знаю» на 40 карточках", test: (s) => s.knows >= 40 },
    { id: "all", he: "ח", name: "Весь путь", how: "Пройдите все восемь недель", test: () => WEEKS.every((w) => weekDone(w.n)) }
  ];

  const INTERVALS = [0, 1, 3, 7, 14];
  const KEY = "derekh.v2";
  const OLD_KEY = "derekh.v1";

  /* ---------- icons ---------- */
  const I = {
    flame: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5c3.5 3.6 6 6.4 6 10.2a6 6 0 0 1-12 0c0-2.4 1.2-4.2 2.6-5.8.2 1.6 1 2.6 2 3C10 7.5 10.6 5 12 2.5z"/></svg>',
    spark: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
    lock: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2" fill="currentColor"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
    cards: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="14" height="13" rx="2"/><path d="M7 3.5h12a2 2 0 0 1 2 2V17"/></svg>',
    star: function (on) {
      return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" fill="' + (on ? "currentColor" : "none") + '" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>';
    }
  };

  /* ---------- state ---------- */
  function fresh() {
    return { xp: 0, streak: 0, best: 0, last: null, lessons: {}, quizzes: {}, cards: {}, knows: 0, badges: {} };
  }
  function migrate(o) {
    const r = Object.assign(fresh(), o);
    r.lessons = {}; r.cards = {}; r.quizzes = {};
    Object.keys(o.lessons || {}).forEach((k) => { r.lessons["w1" + k] = o.lessons[k]; });
    Object.keys(o.cards || {}).forEach((k) => { r.cards["w1" + k] = o.cards[k]; });
    if (o.quiz) r.quizzes.w1 = o.quiz;
    delete r.quiz;
    return r;
  }
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) return Object.assign(fresh(), JSON.parse(raw));
      const old = localStorage.getItem(OLD_KEY);
      if (old) return migrate(JSON.parse(old));
    } catch (e) {}
    return fresh();
  }
  let S = load();
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  }

  const ui = { tab: "path", view: "path", week: 1, scope: null, lessonId: null, step: 0, picked: null, quiz: null, cards: null, cardsMsg: null, resetArm: false, nonce: 0, perm: null, permKey: "" };

  /* ---------- helpers ---------- */
  const pad = (n) => String(n).padStart(2, "0");
  const dkey = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const today = () => dkey(new Date());
  function addDays(k, n) {
    const p = k.split("-").map(Number);
    return dkey(new Date(p[0], p[1] - 1, p[2] + n));
  }
  function fmtDay(k) { const p = k.split("-"); return p[2] + "." + p[1]; }
  function touch() {
    const t = today();
    if (S.last === t) return;
    S.streak = S.last === addDays(t, -1) ? S.streak + 1 : 1;
    S.last = t;
    S.best = Math.max(S.best, S.streak);
  }
  function streakNow() {
    const t = today();
    return S.last === t || S.last === addDays(t, -1) ? S.streak : 0;
  }
  function shuffle(a) {
    const r = a.slice();
    for (let i = r.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const x = r[i]; r[i] = r[j]; r[j] = x;
    }
    return r;
  }
  const W = (n) => WEEKS[n - 1];
  const wLessons = (n) => W(n).lessons;
  const wCards = (n) => W(n).cards;
  const qOf = (n) => S.quizzes["w" + n] || null;
  const allLessons = (n) => wLessons(n).every((l) => S.lessons[l.id]);
  const quizPassed = (n) => !!qOf(n) && qOf(n).best >= 5;
  const weekDone = (n) => allLessons(n) && quizPassed(n);
  const stepsDone = (n) => wLessons(n).filter((l) => S.lessons[l.id]).length + (quizPassed(n) ? 1 : 0);
  const lessonById = (id) => LESSONS.find((l) => l.id === id);
  const curWeek = () => { const w = WEEKS.find((x) => !weekDone(x.n)); return w ? w.n : 0; };
  const esc = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const dueNow = (c) => { const st = S.cards[c.id]; return !st || st.due <= today(); };
  const mastered = (list) => list.filter((c) => S.cards[c.id] && S.cards[c.id].box >= 3).length;
  const starCount = (n) => (n >= 7 ? 3 : n >= 5 ? 2 : 1);
  const xpForQuiz = (n) => n * 10 + (n === 8 ? 30 : 0);
  const reduce = () => window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function newBadges() {
    const out = [];
    BADGES.forEach((b) => {
      if (!S.badges[b.id] && b.test(S)) {
        S.badges[b.id] = today();
        out.push("«" + b.name + "»");
      }
    });
    return out;
  }
  function gain(xp, msg) {
    touch();
    S.xp += xp;
    const nb = newBadges();
    save();
    const parts = [];
    if (msg) parts.push(msg);
    if (nb.length) parts.push("Значок " + nb.join(", "));
    if (parts.length) toast(parts.join(" · "));
  }

  let toastTimer = null;
  function toast(t) {
    const el = document.getElementById("toast");
    el.textContent = t;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 3000);
  }

  function optionOrder(n, key) {
    if (ui.permKey !== key || !ui.perm || ui.perm.length !== n) {
      ui.perm = shuffle(Array.from({ length: n }, (_, i) => i));
      ui.permKey = key;
    }
    return ui.perm;
  }

  /* ---------- views ---------- */
  function hdr() {
    const s = streakNow();
    return '<header class="top"><div class="brand"><h1 class="brand-name">Дерех</h1><span class="he" lang="he" dir="rtl">דרך</span></div>' +
      '<div class="chips"><span class="chip">' + I.flame + '<span class="sr">Дней подряд: </span><b>' + s + '</b></span>' +
      '<span class="chip">' + I.spark + '<span class="sr">Очки: </span><b>' + S.xp + '</b></span></div></header>';
  }

  function stop(l, i) {
    const n = i + 1;
    const done = weekDone(n);
    const cur = n === curWeek();
    const state = done ? "done" : cur ? "current" : "open";
    const node = done ? I.check : l.letter;
    const dn = stepsDone(n);
    let body;
    if (cur || done) {
      const pct = Math.round((dn / 5) * 100);
      const cta = dn === 0 ? "Начать неделю" : done ? "Открыть неделю" : "Продолжить";
      body = '<div class="panel">' +
        '<div class="panel-top"><p class="eyebrow">Неделя ' + n + (done ? " · пройдена" : "") + '</p><span class="he he-term" lang="he" dir="rtl">' + l.he + '</span></div>' +
        '<h2 class="stop-title">' + l.title + '</h2>' +
        '<p class="muted">' + l.desc + '</p>' +
        '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="5" aria-valuenow="' + dn + '" aria-label="Шагов пройдено"><i style="width:' + pct + '%"></i></div>' +
        '<p class="meta">Пройдено ' + dn + ' из 5 шагов · 4 урока, квиз, ' + wCards(n).length + ' карточек</p>' +
        '<button class="btn" data-action="open-level" data-n="' + n + '">' + cta + '</button></div>';
    } else {
      body = '<button class="soft" data-action="open-level" data-n="' + n + '">' +
        '<span class="soft-top"><span class="eyebrow">Неделя ' + n + (dn ? " · " + dn + " из 5" : "") + '</span><span class="he stop-he" lang="he" dir="rtl">' + l.he + '</span></span>' +
        '<span class="stop-title">' + l.title + '</span>' +
        '<span class="muted soft-desc">' + l.desc + '</span></button>';
    }
    return '<li class="stop ' + state + '"><div class="rail"><span class="node">' + node + '</span></div><div class="stop-body">' + body + '</div></li>';
  }

  function viewPath() {
    const cw = curWeek();
    const nd = WEEKS.filter((w) => weekDone(w.n)).length;
    const segs = WEEKS.map((w) => '<i class="' + (weekDone(w.n) ? "on" : w.n === cw ? "cur" : "") + '"></i>').join("");
    return hdr() +
      '<p class="eyebrow">Путь · восемь недель</p>' +
      '<div class="weeks" role="img" aria-label="Пройдено недель: ' + nd + ' из 8">' + segs + '</div>' +
      (cw === 0 ? '<p class="prose">Все восемь недель пройдены. Любую из них можно открыть снова, а карточки продолжают возвращаться по расписанию.</p>' : "") +
      '<ol class="route">' + LEVELS.map(stop).join("") + '</ol>';
  }

  function row(st, dot, title, sub, action, id) {
    return '<li><button class="row ' + st + '" data-action="' + action + '" data-id="' + id + '">' +
      '<span class="dot">' + dot + '</span>' +
      '<span><span class="row-title">' + title + '</span><span class="row-sub">' + sub + '</span></span>' +
      '<span class="chev">' + (st === "locked" ? "" : I.chev) + '</span></button></li>';
  }

  function viewLevel() {
    const n = ui.week;
    const L = W(n);
    const lessonRows = L.lessons.map((l, i) => {
      const d = S.lessons[l.id];
      return row(d ? "done" : "open", d ? I.check : i + 1, esc(l.title), l.steps.length + " шага и вопрос · " + (d ? "пройден" : "+30 очков"), "open-lesson", l.id);
    }).join("");
    const unlocked = allLessons(n);
    const qd = quizPassed(n);
    const q = qOf(n);
    const qSub = !unlocked ? "Откроется после четырёх уроков" : q ? "Лучший результат: " + q.best + " из 8" : "8 вопросов · до 110 очков";
    const qrow = row(qd ? "done" : unlocked ? "open" : "locked", qd ? I.check : unlocked ? 5 : I.lock, "Квиз недели", qSub, "open-quiz", "");
    const src = L.sources.map((x) => '<li><a href="' + esc(x.url) + '" target="_blank" rel="noopener noreferrer">' + esc(x.title) + '</a></li>').join("");
    return '<button class="back" data-action="back-path">' + I.chev + 'Путь</button>' +
      '<div class="lvl-head"><p class="eyebrow">Неделя ' + n + ' из 8</p><h1 class="lvl-title">' + L.title + '</h1><span class="he lvl-he" lang="he" dir="rtl">' + L.he + '</span><p class="muted">' + L.desc + '.</p></div>' +
      '<ol class="rows">' + lessonRows + qrow + '</ol>' +
      '<p class="eyebrow section-label">Повторение</p>' +
      '<ol class="rows"><li><button class="row open" data-action="go-cards" data-n="' + n + '"><span class="dot">' + I.cards + '</span><span><span class="row-title">Карточки недели</span><span class="row-sub">Освоено ' + mastered(wCards(n)) + ' из ' + wCards(n).length + '</span></span><span class="chev">' + I.chev + '</span></button></li></ol>' +
      '<p class="eyebrow section-label">Источники недели</p>' +
      '<p class="meta">Материал сверен с этими изданиями и страницами. Если хотите проверить или почитать глубже, начните отсюда.</p>' +
      '<ul class="srcs">' + src + '</ul>';
  }

  function topBar(total, cur) {
    let segs = "";
    for (let i = 0; i < total; i++) segs += '<i class="' + (i < cur ? "on" : i === cur ? "cur" : "") + '"></i>';
    return '<div class="lbar"><button class="icon-btn" data-action="close" aria-label="Закрыть">' + I.close + '</button><div class="segs" aria-hidden="true">' + segs + '</div></div>';
  }

  function optionsHtml(opts, a, picked, key) {
    const order = optionOrder(opts.length, key);
    return '<div class="opts">' + order.map((i) => {
      let cls = "";
      let mark = "";
      if (picked != null) {
        if (i === a) { cls = " good"; mark = I.check; }
        else if (i === picked) { cls = " bad"; mark = I.close; }
      }
      return '<button class="opt' + cls + '" data-action="pick" data-i="' + i + '"' + (picked != null ? " disabled" : "") + '><span>' + opts[i] + '</span>' + mark + '</button>';
    }).join("") + '</div>';
  }

  function fbHtml(ok, why) {
    return '<div class="fb ' + (ok ? "good" : "bad") + '"><b>' + (ok ? "Верно." : "Не совсем.") + '</b> ' + why + '</div>';
  }

  function viewLesson() {
    const L = lessonById(ui.lessonId);
    const idx = W(L.week).lessons.indexOf(L);
    const total = L.steps.length + 1;
    const s = ui.step;
    let body;
    if (s < L.steps.length) {
      const st = L.steps[s];
      body = '<div class="stack"><p class="eyebrow">Урок ' + (idx + 1) + ' · ' + L.title + '</p>' +
        (st.he ? '<p class="he-hero" lang="he" dir="rtl">' + st.he + '</p>' : "") +
        '<h2>' + st.h + '</h2>' +
        (st.verse ? '<div class="verse"><span class="he" lang="he" dir="rtl">' + st.verse.he + '</span><p>' + st.verse.ru + '</p></div>' : "") +
        '<p class="prose">' + st.p + '</p>' +
        '<button class="btn" data-action="next">Далее</button></div>';
    } else {
      const c = L.check;
      const ok = ui.picked === c.a;
      body = '<div class="stack"><p class="eyebrow">Проверка</p><h2>' + c.q + '</h2>' +
        optionsHtml(c.opts, c.a, ui.picked, "l" + ui.nonce + L.id) +
        (ui.picked != null ? fbHtml(ok, c.why) + '<button class="btn" data-action="finish-lesson">' + (S.lessons[L.id] ? "Завершить" : "Завершить урок") + '</button>' : "") +
        '</div>';
    }
    return topBar(total, s) + body;
  }

  function viewQuiz() {
    const q = ui.quiz;
    const QUIZ = W(ui.week).quiz;
    if (q.done) {
      const c = q.correct;
      const n = starCount(c);
      let stars = "";
      for (let i = 0; i < 3; i++) stars += I.star(i < n);
      const msg = c >= 7 ? "Основы усвоены. Можно двигаться дальше." : c >= 5 ? "Неделя пройдена. Неточности лучше повторить по карточкам." : "До порога не хватило: нужно не меньше 5 из 8. Повторите уроки и карточки и попробуйте ещё раз.";
      const pts = q.diff > 0 ? "+" + q.diff + " очков" : "Повтор без новых очков";
      return '<div class="lbar"><button class="icon-btn" data-action="close" aria-label="Закрыть">' + I.close + '</button></div>' +
        '<div class="stack"><p class="eyebrow">Квиз недели ' + ui.week + '</p>' +
        '<div class="stars" role="img" aria-label="Звёзд: ' + n + ' из 3">' + stars + '</div>' +
        '<p class="result-num">' + c + ' из ' + QUIZ.length + '</p>' +
        '<p class="prose">' + msg + '</p><p class="meta">' + pts + '</p>' +
        '<div class="btn-row"><button class="btn" data-action="close">К неделе</button><button class="btn ghost" data-action="retry-quiz">Пройти ещё раз</button></div></div>';
    }
    const Q = QUIZ[q.i];
    const ok = q.picked === Q.a;
    return topBar(QUIZ.length, q.i) +
      '<div class="stack"><p class="eyebrow">Вопрос ' + (q.i + 1) + ' из ' + QUIZ.length + '</p><h2>' + Q.q + '</h2>' +
      optionsHtml(Q.opts, Q.a, q.picked, "q" + ui.nonce + "-" + q.i) +
      (q.picked != null ? fbHtml(ok, Q.why) + '<button class="btn" data-action="quiz-next">' + (q.i < QUIZ.length - 1 ? "Дальше" : "Результат") + '</button>' : "") +
      '</div>';
  }

  const scopeCards = () => (ui.scope ? wCards(ui.scope) : CARDS);

  function nextDue() {
    const t = today();
    const ds = scopeCards().map((c) => S.cards[c.id]).filter(Boolean).map((s) => s.due).filter((d) => d > t).sort();
    return ds[0] || null;
  }

  function viewCards() {
    const c = ui.cards;
    if (c) {
      const card = CARDS.find((x) => x.id === c.queue[0]);
      const done = c.total - c.queue.length;
      const face = c.flipped
        ? '<span class="term">' + card.term + '</span><span class="he sm" lang="he" dir="rtl">' + card.he + '</span><p class="def">' + card.def + '</p>'
        : '<span class="he" lang="he" dir="rtl">' + card.he + '</span><span class="term">' + card.term + '</span><span class="hint">Нажмите, чтобы увидеть значение</span>';
      return hdr() +
        '<div class="fc-meta"><span>Осталось ' + c.queue.length + ' из ' + c.total + (c.practice ? " · тренировка" : "") + '</span><button class="linkbtn" data-action="end-cards">Закончить</button></div>' +
        '<div class="bar" aria-hidden="true"><i style="width:' + Math.round((done / c.total) * 100) + '%"></i></div>' +
        '<div style="height:14px"></div>' +
        '<button class="fc' + (c.flipped ? " flipped" : "") + '" data-action="flip" aria-label="Перевернуть карточку">' + face + '</button>' +
        (c.flipped ? '<div class="fc-actions"><button class="btn ghost" data-action="again">Ещё раз</button><button class="btn" data-action="know">Знаю</button></div>' : "");
    }
    const pool = scopeCards();
    const due = pool.filter(dueNow).length;
    const nd = nextDue();
    const msg = ui.cardsMsg === "done" ? "Сессия закончена." : due === 0 ? "На сегодня всё повторено." : "";
    const itemOf = (x) => {
      const box = S.cards[x.id] ? S.cards[x.id].box : 0;
      let pips = "";
      for (let i = 0; i < 4; i++) pips += '<i class="' + (i < box ? "on" : "") + '"></i>';
      return '<li><span class="t">' + x.term + '</span><span class="he" lang="he" dir="rtl">' + x.he + '</span><span class="pips" role="img" aria-label="Освоение: ' + Math.min(box, 4) + ' из 4">' + pips + '</span></li>';
    };
    let list = "";
    (ui.scope ? [W(ui.scope)] : WEEKS).forEach((w) => {
      list += '<p class="eyebrow section-label">Неделя ' + w.n + ' · ' + w.title + '</p><ol class="terms">' + w.cards.map(itemOf).join("") + '</ol>';
    });
    return hdr() +
      (ui.scope ? '<button class="back" data-action="back-level" data-n="' + ui.scope + '">' + I.chev + 'К неделе</button>' : "") +
      '<div class="lead"><p class="eyebrow">' + (ui.scope ? "Карточки недели " + ui.scope : "Все карточки") + '</p><h2>' + (msg || "Повторение терминов") + '</h2></div>' +
      '<p class="stat-line"><span>К повторению: <b>' + due + '</b></span><span>Освоено: <b>' + mastered(pool) + ' из ' + pool.length + '</b></span>' + (due === 0 && nd ? '<span>Следующее: <b>' + fmtDay(nd) + '</b></span>' : "") + '</p>' +
      '<div class="btn-row">' +
      (due > 0 ? '<button class="btn" data-action="start-cards">Повторить · ' + due + '</button>' : '<button class="btn" data-action="start-cards" data-practice="1">Потренироваться ещё</button>') +
      (due > 0 ? '<button class="btn ghost" data-action="start-cards" data-practice="1">Тренировка без записи</button>' : "") +
      '</div>' + list;
  }

  function viewBadges() {
    const items = BADGES.map((b) => {
      const got = S.badges[b.id];
      return '<div class="badge' + (got ? " on" : "") + '"><span class="medal" lang="he" dir="rtl">' + b.he + '</span><span class="badge-name">' + b.name + '</span><span class="badge-how">' + (got ? "Получен " + fmtDay(got) : b.how) + '</span></div>';
    }).join("");
    const earned = Object.keys(S.badges).length;
    return hdr() +
      '<div class="lead"><p class="eyebrow">Значки</p><h2>Получено ' + earned + ' из ' + BADGES.length + '</h2></div>' +
      '<div class="bgrid">' + items + '</div>' +
      '<div class="reset"><p class="meta">Прогресс хранится на этом устройстве.</p>' +
      (window.DEREKH_PWA ? '<p class="meta">Чтобы не потерять его или перенести на другое устройство, сохраните его в файл.</p><div class="btn-inline"><button class="btn-sm" data-action="export">Сохранить прогресс в файл</button><button class="btn-sm" data-action="import">Загрузить из файла</button></div>' : "") +
      (ui.resetArm
        ? '<p>Стереть очки, уроки, карточки и значки?</p><div class="btn-inline"><button class="btn-sm danger" data-action="reset-do">Да, стереть</button><button class="btn-sm" data-action="reset-cancel">Отмена</button></div>'
        : '<button class="btn-sm" data-action="reset-arm">Начать заново</button>') +
      '</div>';
  }

  /* ---------- render ---------- */
  const app = document.getElementById("app");
  const tabs = document.getElementById("tabs");

  function render() {
    let h = "";
    let focus = false;
    switch (ui.view) {
      case "level": h = viewLevel(); break;
      case "lesson": h = viewLesson(); focus = true; break;
      case "quiz": h = viewQuiz(); focus = true; break;
      case "cards": h = viewCards(); break;
      case "badges": h = viewBadges(); break;
      default: h = viewPath();
    }
    app.className = "app" + (focus ? " focus" : "");
    app.innerHTML = h;
    tabs.hidden = focus;
    tabs.querySelectorAll("button").forEach((b) => {
      if (b.dataset.tab === ui.tab) b.setAttribute("aria-current", "page");
      else b.removeAttribute("aria-current");
    });
  }
  function scrollTop() { try { window.scrollTo(0, 0); } catch (e) {} }
  function go(view) { ui.view = view; render(); scrollTop(); }
  function reveal() {
    const f = document.querySelector(".fb");
    if (f && f.scrollIntoView) f.scrollIntoView({ block: "nearest", behavior: reduce() ? "auto" : "smooth" });
  }

  function newQuiz() {
    ui.nonce++;
    ui.quiz = { i: 0, picked: null, correct: 0, done: false, diff: 0 };
  }

  function finishQuiz() {
    const q = ui.quiz;
    const c = q.correct;
    const prev = qOf(ui.week) ? qOf(ui.week).best : null;
    const best = prev == null ? c : Math.max(c, prev);
    const diff = xpForQuiz(best) - (prev == null ? 0 : xpForQuiz(prev));
    S.quizzes["w" + ui.week] = { best: best, stars: starCount(best) };
    q.done = true;
    q.diff = diff;
    gain(Math.max(diff, 0), diff > 0 ? "+" + diff + " очков" : null);
    render();
    scrollTop();
  }

  /* ---------- actions ---------- */
  function act(a, d) {
    switch (a) {
      case "tab":
        ui.tab = d.tab;
        ui.view = d.tab;
        ui.scope = null; ui.cards = null; ui.cardsMsg = null;
        render(); scrollTop();
        break;
      case "open-level": ui.tab = "path"; ui.week = Number(d.n) || ui.week; go("level"); break;
      case "back-level": ui.week = Number(d.n) || ui.week; ui.scope = null; ui.cards = null; ui.cardsMsg = null; ui.tab = "path"; go("level"); break;
      case "back-path": go("path"); break;
      case "go-cards": ui.tab = "cards"; ui.scope = Number(d.n) || null; ui.cards = null; ui.cardsMsg = null; go("cards"); break;
      case "open-lesson":
        ui.lessonId = d.id; ui.step = 0; ui.picked = null; ui.nonce++;
        go("lesson");
        break;
      case "next": ui.step++; render(); scrollTop(); break;
      case "pick": {
        if (ui.view === "lesson") {
          if (ui.picked != null) return;
          ui.picked = Number(d.i);
        } else {
          const q = ui.quiz;
          if (q.picked != null) return;
          q.picked = Number(d.i);
          if (q.picked === W(ui.week).quiz[q.i].a) q.correct++;
        }
        render(); reveal();
        break;
      }
      case "finish-lesson": {
        const L = lessonById(ui.lessonId);
        const ok = ui.picked === L.check.a;
        if (!S.lessons[L.id]) {
          S.lessons[L.id] = { ok: ok };
          const g = 20 + (ok ? 10 : 0);
          gain(g, "+" + g + " очков");
        } else {
          gain(0, "Урок повторён");
        }
        go("level");
        break;
      }
      case "close": go("level"); break;
      case "open-quiz":
        if (!allLessons(ui.week)) { toast("Квиз откроется после четырёх уроков"); return; }
        newQuiz();
        go("quiz");
        break;
      case "quiz-next": {
        const q = ui.quiz;
        if (q.picked == null) return;
        if (q.i < W(ui.week).quiz.length - 1) { q.i++; q.picked = null; ui.nonce++; render(); scrollTop(); }
        else finishQuiz();
        break;
      }
      case "retry-quiz": newQuiz(); render(); scrollTop(); break;
      case "start-cards": {
        const practice = d.practice === "1";
        const ids = scopeCards().filter((c) => practice || dueNow(c)).map((c) => c.id);
        if (!ids.length) { toast("На сегодня всё повторено"); return; }
        ui.cards = { queue: shuffle(ids), flipped: false, total: ids.length, practice: practice };
        ui.cardsMsg = null;
        render(); scrollTop();
        break;
      }
      case "flip":
        if (ui.cards) { ui.cards.flipped = !ui.cards.flipped; render(); }
        break;
      case "know":
      case "again": {
        const c = ui.cards;
        if (!c || !c.flipped) return;
        const id = c.queue.shift();
        if (!c.practice) {
          const st = S.cards[id] || { box: 0, due: today() };
          if (a === "know") {
            st.box = Math.min(st.box + 1, 4);
            st.due = addDays(today(), INTERVALS[st.box]);
            S.cards[id] = st;
            S.knows++;
            gain(2, null);
          } else {
            st.box = 0;
            st.due = today();
            S.cards[id] = st;
            touch();
            save();
          }
        }
        if (a === "again") c.queue.push(id);
        c.flipped = false;
        if (!c.queue.length) { ui.cards = null; ui.cardsMsg = "done"; }
        render(); scrollTop();
        break;
      }
      case "end-cards": ui.cards = null; ui.cardsMsg = null; render(); break;
      case "export": {
        try {
          const blob = new Blob([JSON.stringify({ app: "derekh", version: 2, state: S })], { type: "application/json" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "derekh-progress-" + today() + ".json";
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(a.href), 4000);
          toast("Файл с прогрессом сохранён");
        } catch (e) { toast("Не удалось сохранить файл"); }
        break;
      }
      case "import": {
        const inp = document.createElement("input");
        inp.type = "file"; inp.accept = ".json,application/json";
        inp.onchange = function () {
          const f = inp.files && inp.files[0];
          if (!f) return;
          const r = new FileReader();
          r.onload = function () {
            try {
              const o = JSON.parse(r.result);
              const st = o && o.app === "derekh" ? o.state : null;
              if (!st || typeof st.lessons !== "object" || typeof st.quizzes !== "object" || typeof st.cards !== "object") throw new Error("bad");
              S = Object.assign(fresh(), st);
              save(); render(); toast("Прогресс загружен");
            } catch (e) { toast("Это не файл прогресса «Дерех»"); }
          };
          r.readAsText(f);
        };
        inp.click();
        break;
      }
      case "reset-arm": ui.resetArm = true; render(); break;
      case "reset-cancel": ui.resetArm = false; render(); break;
      case "reset-do":
        S = fresh(); save();
        ui.resetArm = false; ui.cards = null; ui.cardsMsg = null; ui.quiz = null; ui.scope = null;
        render(); toast("Прогресс стёрт");
        break;
    }
  }

  document.addEventListener("click", function (e) {
    const t = e.target.closest("[data-action]");
    if (!t || t.disabled) return;
    act(t.dataset.action, t.dataset);
  });

  render();
})();
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
</script>
